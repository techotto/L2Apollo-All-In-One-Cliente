; =============================================================================
; L2Apollo — Tournament (config completo)
; Comentarios usam ";" (padrao INI). Nao use "//" — o script nao ignora isso.
; =============================================================================
; Fluxo:
;   1) Horario (TIMES + OFFSET) -> entra no LOBBY (teleporte)
;   2) NPC de registro -> clica botao
;   3) Espera o FIM do evento (duracao / NPC sumiu / arena...)
;   4) Sai do LOBBY (item / dialog / NPC) se configurado
; =============================================================================

[Geral]
; Liga (1) ou desliga (0) o modulo Tournament
ENABLED=1

[Schedule]
; Horarios do ANUNCIO do evento (HH:MM)
TIMES=09:15,12:15,16:15,20:15

; Segundos DEPOIS do anuncio para comecar a se inscrever
; 5 minutos = 300s  (ex.: anuncia 09:15 -> inscricao 09:20)
REGISTER_OFFSET_SEC=15

; Quanto tempo (segundos) a janela fica aberta apos o OFFSET
; = duracao toda do evento (30 min = 1800s) — cicla registro o tempo todo
REGISTER_WINDOW_SEC=1800

; 1 = no maximo 1 registro por horario do dia
; 0 = ciclo: registra -> arena -> volta lobby -> registra de novo (na hora do NPC)
ONCE_PER_SLOT=0

; ---------------------------------------------------------------------------
; Entrar no MEIO da janela (script ligou atrasado / evento ja andando)?
; 1 = SIM (Tournament, SoloBoss, etc. — recomendado)
; 0 = NAO: so entra nos primeiros LATE_JOIN_GRACE_SEC apos abrir a inscricao
; ---------------------------------------------------------------------------
ALLOW_LATE_JOIN=1

; So usado se ALLOW_LATE_JOIN=0: segundos apos o inicio da inscricao
; em que ainda aceita comecar (ex.: 45 = so nos primeiros 45s)
LATE_JOIN_GRACE_SEC=45

[Teleport]
; Como ENTRAR no LOBBY de inscricao: NONE | BYPASS | ITEM | NPC
TELEPORT_MODE=ITEM

; Bypass direto se TELEPORT_MODE=BYPASS (ex.: bypass -h ... ou comando do server)
TELEPORT_BYPASS=

; ID do item de teleporte (0 = resolve pelo nome abaixo)
TELEPORT_ITEM_ID=5588

; Nome (parcial) do item se ID=0 (ex.: Book Teleport)
TELEPORT_ITEM_NAME=Book Teleport

; Delay apos usar o item, antes de clicar no menu (ms)
TELEPORT_ITEM_OPEN_DELAY_MS=1500

; Botoes do menu em sequencia. Formato: Texto, Index | Texto, Index
; Index = qual ocorrencia do texto (1=primeiro, 2=segundo...)
TELEPORT_MENU_BUTTONS=Tournament Zone, 1

; Index padrao se o passo em MENU_BUTTONS nao trouxer ", N"
TELEPORT_MENU_BUTTON_INDEX=1

; Delay entre cliques de menu na entrada (ms)
TELEPORT_MENU_BUTTON_DELAY_MS=1200

; --- Se TELEPORT_MODE=NPC: NPC gatekeeper de entrada ---
; ID do NPC que abre o menu de teleporte
GATE_NPC_ID=0

; Coordenadas do NPC de entrada (ajuda a caminhar ate ele)
GATE_NPC_X=0
GATE_NPC_Y=0
GATE_NPC_Z=0

; Distancia pra falar com o gatekeeper
GATE_APPROACH_DIST=80

; Range maximo pra considerar o gatekeeper alcancavel
GATE_MAX_SEARCH_DIST=3000

; Delay apos abrir dialogo do gatekeeper (ms)
GATE_DIALOG_OPEN_DELAY_MS=1500

; Delay entre passos de caminhada ate o gatekeeper (ms)
GATE_MOVE_DELAY_MS=2000

; Apos teleportar, espera chegar perto das coords do NPC de registro
ARRIVAL_RANGE=5000

; Timeout dessa espera de chegada (ms)
ARRIVAL_TIMEOUT_MS=45000

[Npc]
; ID do NPC que registra no Battle Tournament
NPC_ID=29055

; Coordenadas do NPC de registro (obrigatorias pra zona/lobby)
NPC_X=-20184
NPC_Y=-21005
NPC_Z=-3026

; Distancia pra abrir dialogo com o NPC de registro
NPC_APPROACH_DIST=80

; Distancia maxima pra considerar que voce esta no LOBBY
NPC_MAX_SEARCH_DIST=3000

; Delay apos abrir dialogo do NPC de registro (ms)
NPC_DIALOG_OPEN_DELAY_MS=1500

; Delay entre passos andando ate o NPC (ms)
MOVE_TO_NPC_DELAY_MS=2000

[Register]
; Texto do botao de registro (+ index opcional na mesma linha)
; Formas: "Register 1x1"  ou  "Register 1x1, 1"
BUTTON_LABEL=Register 1x1, 1

; Qual ocorrencia do botao clicar (1=primeiro). Sobrescreve se vier depois do LABEL
BUTTON_INDEX=1

; Delay apos clicar o botao de registro (ms)
BUTTON_DELAY_MS=1500

; Delay ao fechar dialogos com ESC (ms)
DIALOG_CLOSE_DELAY_MS=400

[LobbyBuffer]
; ---------------------------------------------------------------------------
; Se faltar REQUIRED_BUFFS (buffer.ini) e voce estiver na LOBBY do Tournament,
; bufa no Global Buffer da lobby (NAO e entre luta na arena — so na lobby).
; Mesma arquitetura do buffer.ini (falar + BUFFER_ROUTE); so muda o NPC/coords.
; ---------------------------------------------------------------------------
LOBBY_BUFFER_ENABLED=1

; Nome parcial do NPC (Impact: Global Buffer). ID=0 = so pelo nome.
LOBBY_BUFFER_NPC_ID=55005
LOBBY_BUFFER_NPC_NAME=Global Buffer

; Coords do Global Buffer na lobby do Tournament
LOBBY_BUFFER_NPC_X=-20768
LOBBY_BUFFER_NPC_Y=-20271
LOBBY_BUFFER_NPC_Z=-3024
LOBBY_BUFFER_APPROACH_DIST=80
LOBBY_BUFFER_MAX_SEARCH_DIST=3500
LOBBY_BUFFER_DIALOG_OPEN_DELAY_MS=1500
LOBBY_BUFFER_MOVE_DELAY_MS=2000

; Rota do menu. Vazio = reusa BUFFER_ROUTE do buffer.ini
; Ex.: Scheme,1 | Magic support,1 | Use on Me,1
LOBBY_BUFFER_ROUTE=

LOBBY_BUFFER_BUTTON_DELAY_MS=1200
LOBBY_BUFFER_VALIDATE_WAIT_MS=2000
LOBBY_BUFFER_MAX_ATTEMPTS=3

[EventEnd]
; Como saber que o evento acabou (APOS registrar com sucesso)
; DURATION | NPC_GONE | ARENA | WINDOW | DURATION_OR_NPC_GONE | DURATION_OR_ARENA | NONE
;
; Com ONCE_PER_SLOT=0: apos o 1o registro, cicla arena/volta e re-registra
; ate acabar EVENT_DURATION_SEC (duracao total do evento).
EVENT_END_MODE=DURATION

; Duracao TOTAL do evento em segundos (a partir do 1o registro OK)
; 1800 = 30 minutos ; 1500 = 20 minutos 
EVENT_DURATION_SEC=1500

; Em NPC_GONE: quanto tempo o NPC precisa ficar ausente pra confirmar (ms)
NPC_GONE_CONFIRM_MS=5000

; Em NPC_GONE: so valida "sumiu" se voce estiver perto do lobby ate essa dist
NPC_GONE_CHECK_RANGE=3500

; Quanto tempo esperar o NPC aparecer no lobby antes de desistir (segundos)
; 0 = espera ate acabar a janela de inscricao (REGISTER_WINDOW_SEC)
; Nao falha na hora se o lobby estiver vazio (ex.: horario de teste)
NPC_WAIT_TIMEOUT_SEC=0

; ---------------------------------------------------------------------------
; Safety: se ficou X segundos no Tournament SEM registrar (NPC nao veio,
; travou, etc.), aborta o slot e executa [ExitLobby] (mande pra Giran la).
; 0 = desligado
; Ex.: 300 = 5 minutos parado -> vai embora
; Obs.: se a janela de inscricao (REGISTER_WINDOW_SEC) acabar antes,
;       tambem sai automaticamente pra nao ficar preso no lobby.
; ---------------------------------------------------------------------------
IDLE_ABORT_SEC=300

; 1 = sai do lobby logo apos registrar (ignora espera do evento)
; 0 = espera o fim (DURATION/NPC/etc.) antes de sair
AUTO_EXIT_AFTER_REGISTER=0

; 1 = ao detectar fim do evento, executa [ExitLobby]
; 0 = so marca o slot como concluido, sem sair
AUTO_EXIT_ON_EVENT_END=1

[ExitLobby]
; Como SAIR do lobby (fim do evento, idle abort, auto-exit...)
; Configure aqui o destino (ex.: Giran) — o idle abort usa este mesmo bloco
; NONE | BYPASS | ITEM | NPC
EXIT_MODE=NPC

; Bypass direto se EXIT_MODE=BYPASS
EXIT_BYPASS=

; ID do item pra sair (0 = resolve pelo nome)
EXIT_ITEM_ID=

; Nome (parcial) do item de saida
EXIT_ITEM_NAME=

; Delay apos usar o item de saida (ms)
EXIT_ITEM_OPEN_DELAY_MS=1500

; Botoes do menu de saida: Texto, Index | ...
; Ex. pra Giran: Giran, 1   ou   Town, 1 | Giran, 1
EXIT_MENU_BUTTONS=Giran, 1

; Index padrao dos botoes de saida sem ", N"
EXIT_MENU_BUTTON_INDEX=1

; Delay entre cliques do menu de saida (ms)
EXIT_MENU_BUTTON_DELAY_MS=1200

; --- Se EXIT_MODE=NPC: NPC pra sair do lobby ---
EXIT_GATE_NPC_ID=55006
EXIT_GATE_NPC_X=-20834
EXIT_GATE_NPC_Y=-21793
EXIT_GATE_NPC_Z=-3024
EXIT_GATE_APPROACH_DIST=80
EXIT_GATE_MAX_SEARCH_DIST=3000
EXIT_GATE_DIALOG_OPEN_DELAY_MS=1500
EXIT_GATE_MOVE_DELAY_MS=2000

[Zones]
; ---------------------------------------------------------------------------
; O script precisa saber ONDE voce esta: LOBBY (inscricao) ou ARENA (luta).
;
; LOBBY  = perto das coords do NPC de registro (NPC_X/Y + NPC_MAX_SEARCH_DIST)
;
; ARENA  = depende do ZONE_MODE abaixo:
;
;   LEAVE_NPC (mais simples — use se nao souber as coords da arena)
;     Se voce estiver LONGE do NPC de registro (>= LEAVE_AREA_DIST),
;     o script entende que voce SAIU do lobby / foi pra luta.
;     Ex.: NPC em -20184,-21005 e LEAVE=5000
;          -> dist 6000 = ARENA | dist 1000 = ainda LOBBY
;
;   ARENA_CIRCLE (mais preciso — use se souber o centro da arena)
;     Voce informa o centro da arena (ARENA_X/Y/Z) e o raio (ARENA_RADIUS).
;     Se estiver DENTRO desse circulo = ARENA.
;     Se estiver perto do NPC = LOBBY.
; ---------------------------------------------------------------------------

; Escolha: LEAVE_NPC  ou  ARENA_CIRCLE
ZONE_MODE=LEAVE_NPC

; So usado em LEAVE_NPC:
; Distancia do NPC a partir da qual o script considera que voce ja saiu do lobby
LEAVE_AREA_DIST=5000

; So usado em ARENA_CIRCLE:
; Centro da arena de batalha (pegue as coords la dentro da luta)
ARENA_X=0
ARENA_Y=0
ARENA_Z=0

; So usado em ARENA_CIRCLE:
; Raio em torno do centro — dentro disso = esta na ARENA
ARENA_RADIUS=2000

[Loop]
; Intervalo minimo entre acoes do modulo (ms) — menor = reage mais rapido ao NPC
SCAN_INTERVAL_MS=500

; Intervalo dos logs de espera/idle (ms)
WAIT_LOG_INTERVAL_MS=15000

; Tentativas maximas de ENTRAR no lobby
MAX_TELEPORT_ATTEMPTS=3

; Tentativas maximas de REGISTRAR no NPC
MAX_REGISTER_ATTEMPTS=5

; Tentativas maximas de SAIR do lobby
MAX_EXIT_ATTEMPTS=3

[Adrenaline]
; Espelha "Finalizar PVP R" (bloco Jogadores agressivos) durante o Tournament.
; A API do Adrenaline NAO liga a checkbox direto — o script ataca players no
; range e liga Face Control. Skills CHAR vêm da lista de ataque do bot.
FINISH_PVP=1
FINISH_PVP_RANGE=3000

; Opcional: carregar um config do Adrenaline (pasta Settings) COM a checkbox
; "Finalizar PVP" marcada. Ex.: duplica seu config, marca Finalizar PVP, salva
; como L2Apollo_Tour e coloca o nome aqui.
;CFG_DURING_EVENT=L2Apollo_Tour
;CFG_AFTER_EVENT=L2Apollo_Farm
