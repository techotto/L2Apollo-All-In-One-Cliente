; =============================================================================
; L2Apollo — Auto Farm do SERVIDOR (HTML)  [Valakas / tag <img>]
; =============================================================================
; Status = TAG completa (nao texto ON/OFF):
;   LIGADO:    <img src="panel.online" width="15" height="15">
;   DESLIGADO: <img src="panel.offline" width="15" height="15">
; Clique: Toggle  action=bypass bp_autofarm_toggle
; =============================================================================

[Html]
ENABLE_AUTOFARM=1
OPEN_MODE=BYPASS
OPEN_COMMAND=.autofarm
OPEN_MENU_BUTTONS=
OPEN_DELAY_MS=1500
OPEN_MENU_DELAY_MS=1200
WINDOW_NEEDLES=auto farm system|target range|exclude tartget|bp_autofarm|panel.online|panel.offline|toggle
DETECT_MODE=STATUS
TEXT_ACTIVE=<img src="panel.online" width="15" height="15">
TEXT_INACTIVE=<img src="panel.offline" width="15" height="15">
ACTION_DELAY_MS=800
CLOSE_AFTER=0
RECHECK_MS=20000
DEBUG_DUMP_HTML=0
CHECKED_NEEDLE=checkbox_checked

; Opcional: Toggle <-> linha Status (script prioriza a <img> acima)
STATUS_MAP=Toggle,1:Status

[Default]
DEF_STOP=Toggle,1

[Farm]
FARM_AF_ENABLED=1
FARM_AF_TEXT_ACTIVE=<img src="panel.online" width="15" height="15">
FARM_AF_TEXT_INACTIVE=<img src="panel.offline" width="15" height="15">
FARM_AF_APPLY=Toggle,1

