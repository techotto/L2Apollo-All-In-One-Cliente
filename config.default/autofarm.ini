; =============================================================================
; L2Apollo — Auto Farm do SERVIDOR (HTML)  [SIMPLES]
; =============================================================================
; 1) [Html]  = como ABRIR a janela + textos ON/OFF + STATUS_MAP
; 2) Por evento = so ENABLED + APPLY (lista de cliques)
; 3) [Default] DEF_STOP = cliques ao sair / TP / morte
;
; APPLY / DEF_STOP — formatos (separados por |):
;   Set,1 / Toggle / Auto Target TvT   = clique no label
;   Long / action:MONSTERS / @PLAYERS  = checkbox via action=
;
; Multi-janela (Attack e Target em lugares diferentes):
;   open:.autofarm|Toggle
;   open:.menu|menu:Auto Target Event,1|Auto Target TvT
;   open:.menu|menu:Auto Farm,1|Toggle|open:.menu|menu:Auto Target Event,1|Auto Target PvP
; (open: fecha e abre; menu: clica o botao do .menu)
;
; STATUS_MAP liga o clique ao texto da linha pra ler ON/OFF:
;   Toggle:Status|Auto Target TvT:Target TvT Event
; Assim nao clica 2x se ja estiver no estado certo.
; =============================================================================

[Html]
ENABLE_AUTOFARM=1
OPEN_MODE=BYPASS
OPEN_COMMAND=.autofarm
OPEN_MENU_BUTTONS=Auto Farm,1
OPEN_DELAY_MS=1500
OPEN_MENU_DELAY_MS=1200
WINDOW_NEEDLES=auto attack|auto target|shortcut page|target range|auto farm state|toggle|target pvp|target tvt|auto farm system|exclude tartget| Auto Farm
DETECT_MODE=STATUS
TEXT_ACTIVE=ON
TEXT_INACTIVE=OFF
ACTION_DELAY_MS=800
CLOSE_AFTER=1
RECHECK_MS=20000
DEBUG_DUMP_HTML=0
CHECKED_NEEDLE=checkbox_checked

; Clique -> linha de status (pra saber se ja esta ON/OFF)
; Fica no [Html] junto com abrir/detectar
STATUS_MAP=Set,1:Auto Attack|Set,2:Auto Target|STOP,1:STOPPED

[Default]
; Ao sair / TP / morte. Vazio = desliga so o que STATUS_MAP achar ON.
DEF_STOP=Set,1|Set,2

[Farm]
FARM_AF_ENABLED=1
FARM_AF_APPLY=open:.menu|menu:Auto Farm, 1|Set,1|Set,2|action:voiced_setTargetRange LONG|action:voiced_setTargetMode MONSTERS

[TVT]
TVT_AF_ENABLED=1
TVT_AF_APPLY=Set,1|Set,2|action:voiced_setTargetRange LONG|action:voiced_setTargetMode PLAYERS

[PvPEvent]
PVPEVENT_AF_ENABLED=1
PVPEVENT_AF_APPLY=Set,1|Set,2|action:voiced_setTargetMode PLAYERS|action:voiced_setTargetRange LONG

[KTB]
KTB_AF_ENABLED=0
KTB_AF_APPLY=

[PvPFarm]
PVPFARM_AF_ENABLED=1
PVPFARM_AF_APPLY=Set,1|Set,2|action:voiced_setTargetMode ANY|action:voiced_setTargetRange LONG

[SoloBoss]
SOLOBOSS_AF_ENABLED=0
SOLOBOSS_AF_APPLY=

[Tournament]
TOURNAMENT_AF_ENABLED=1
TOURNAMENT_AF_APPLY=Set,1|Set,2|Players|action:voiced_setTargetRange LONG
