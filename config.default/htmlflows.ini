; =============================================================================
; L2Apollo — HTML Flows (cenarios genericos)
; =============================================================================
; Runtime: HtmlFlowRunIf(Enabled, FlowsAA, FlowsAT, EVENT, WHEN) nos modulos.
;
; Cada evento .ini [Flows]:
;   ENABLE_HTML_FLOWS=1         — LIGA o flow neste evento (AutoGB, menus, etc.)
;   ENABLE_FLOWS_AUTO_ATTACK=1  — inclui cenarios CONTROL=ATTACK
;   ENABLE_FLOWS_AUTO_TARGET=1  — inclui cenarios CONTROL=TARGET
;   FLOW_REASSERT_SEC=60        — reexecuta START a cada N seg (0 = 1x)
;   CONTROL=ALL (Ambos) roda com o master ligado, mesmo com AA/AT = 0
;
; Compat: sem ENABLE_HTML_FLOWS → master = (AA or AT) das chaves Flow:*
;
; EVENT=STOP (igual DEF_STOP do AutoFarm antigo):
;   Configure o HTML pra DESLIGAR (Toggle OFF / panel.offline).
;   Roda antes de TP / buffer / sair do Farm / ceder pra outro evento.
;   WHEN=START (padrao). CONTROL=Ambos.
;
; FARM / PVPFARM:
;   TELEPORTE = ANTES do TP (ainda em Giran / fora do spot)
;   START     = ao CHEGAR no mapa/zona (apos TP ou ja logou la)
;   END       = saiu de verdade
;
; Demais eventos: WHEN START | TELEPORTE | END | MANUAL
; Cenario CONTROL: Auto Attack / Auto Target / Ambos
; Regra = FAZER -> OBJETIVO -> se falhar ELSE
; Match = substring EXATA no HTML. Multilinha: \n
; =============================================================================

[Meta]
VERSION=1
SCENARIO_COUNT=0
