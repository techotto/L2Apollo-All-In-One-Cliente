; =============================================================================
; L2Apollo — PvP Event
; =============================================================================
; Fluxo completo:
;   1) Chega o horario (TIMES) -> Buffer (se BUFFER=1 no main.ini)
;   2) Teleporta com Book/GK no botao [PvP Event]
;   3) Fora de Giran = entrou na zona -> combate players
;   4) Luta durante EVENT_DURATION_SEC
;   5) EXIT volta pra Giran e marca o horario como feito
;
; Combate: menor HP + "execucao" (trava em alvo com pouco HP%) — estilo ultimoPVP.
; =============================================================================

[Geral]
; 1 = modulo ativo neste .ini | 0 = desligado (mesmo com PVPEVENT=1 no main)
ENABLED=1

[Schedule]
; Horarios do dia (HH:MM) — visivel no painel
TIMES=04:01, 08:01, 14:01, 18:01, 22:00, 00:35

ALLOW_LATE_JOIN=1

; --- Avancado (accordion "Mais opcoes da agenda") ---
REGISTER_OFFSET_SEC=10
REGISTER_WINDOW_SEC=1200
ONCE_PER_SLOT=0
LATE_JOIN_GRACE_SEC=1800

[Teleport]
; ITEM | NPC | BYPASS | NONE
TELEPORT_MODE=ITEM
TELEPORT_MENU_BUTTONS=Pvp Event, 1|

TELEPORT_ITEM_ID=5588
TELEPORT_ITEM_NAME=Tutorial Guide
TELEPORT_BYPASS=

GATE_NPC_ID=0
GATE_NPC_X=0
GATE_NPC_Y=0
GATE_NPC_Z=0

; --- Avancado (accordion "Mais opcoes do teleporte") ---
TELEPORT_ITEM_OPEN_DELAY_MS=1500
TELEPORT_MENU_BUTTON_INDEX=1
TELEPORT_MENU_BUTTON_DELAY_MS=1200
GATE_APPROACH_DIST=80
GATE_MAX_SEARCH_DIST=3000
GATE_DIALOG_OPEN_DELAY_MS=1500
GATE_MOVE_DELAY_MS=2000
ARRIVAL_TIMEOUT_MS=90000
MAX_TELEPORT_ATTEMPTS=6

[Giran]
; ---------------------------------------------------------------------------
; NAO edite aqui — coords oficiais em buffer.ini [Giran].
; Com Buffer ligado, PvP Event copia de la. Abaixo = fallback se Buffer OFF.
; ---------------------------------------------------------------------------
GIRAN_X=82872
GIRAN_Y=148648
GIRAN_Z=-3464
GIRAN_RADIUS=5000

[Zone]
; Area do PvP Event (IMPORTANTE pro EXIT) — pack visivel no painel
ZONE_X=90792
ZONE_Y=189139
ZONE_Z=-3755
ZONE_RADIUS=25000

; --- Avancado (accordion "Mais opcoes da zona") ---
LEFT_ARENA_GRACE_SEC=12

[Event]
; Duracao da luta DENTRO da zona (depois de entrar)
EVENT_DURATION_SEC=1200

[Combat]
TARGET_MODE=LOWEST_HP
TARGET_RANGE=1300
FOCUS_LOW_HP_PCT=60
LOCK_UNTIL_KILL=1
FINISH_PVP=1
FACE_CONTROL=1

; --- Avancado (accordion "Mais opcoes do combate") ---
TARGET_RESCAN_MS=500
TARGET_STICKY_MS=2500
SWITCH_HP_MARGIN=200
SWITCH_DIST_MARGIN=150
EXEC_SWITCH_PCT_MARGIN=100
ATTACK_ONLY_ON_EXECUTION=0
FINISH_PVP_RANGE=1200

[Skills]
; Vazio = so FaceControl. Preencha F1/F2/F3 se quiser forcar teclas.
SKILL_1_KEY=F1
SKILL_1_INTERVAL_MS=1
SKILL_2_KEY=F2
SKILL_2_INTERVAL_MS=0
SKILL_3_KEY=F3
SKILL_3_INTERVAL_MS=0

[Center]
; 1 = sem alvo, anda ate o centro | 0 = fica parado
ENABLE_CENTER_MOVE=0
CENTER_X=10460
CENTER_Y=-24375
CENTER_Z=-3648
CENTER_RADIUS=5000

[Exit]
