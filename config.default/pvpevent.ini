; =============================================================================
; L2Apollo — PvP Event
; =============================================================================
; Fluxo completo:
;   1) Chega o horario (TIMES) -> Buffer (se BUFFER=1 no main.ini)
;   2) Teleporta com Book/GK no botao [PvP Event]
;   3) Fora de Giran = entrou na zona -> combate players
;   4) Luta durante EVENT_DURATION_SEC
;   5) EXIT volta pra Giran e marca o horario como feito
;
; Combate: menor HP + "execucao" (trava em alvo com pouco HP%) — estilo ultimoPVP.
; =============================================================================

[Geral]
; 1 = modulo ativo neste .ini | 0 = desligado (mesmo com PVPEVENT=1 no main)
ENABLED=1

[Schedule]
; -----------------------------------------------------------------------------
; Agenda — quando o bot TENTA ENTRAR no evento
; -----------------------------------------------------------------------------

; Horarios do dia (HH:MM), separados por virgula.
; Ex.: TIMES=12:00,16:00,20:00
TIMES=13:30

; Adiantamento (segundos) antes do horario pra ja poder entrar.
; 0 = comeca exatamente no TIMES | 60 = comeca 1 min antes
REGISTER_OFFSET_SEC=10

; Quanto tempo a janela de ENTRADA fica aberta apos o horario (segundos).
; Ex.: TIMES=12:00 + WINDOW=300 → pode entrar ate 12:05.
; A luta em si NAO usa isto — usa EVENT_DURATION_SEC.
REGISTER_WINDOW_SEC=1800

; 1 = faz o evento 1x por horario e nao repete na mesma janela
; 0 = pode reentrar se a janela ainda estiver aberta
ONCE_PER_SLOT=0

; 1 = se chegar atrasado (dentro da grace), ainda tenta entrar
; 0 = so entra se pegar o inicio da janela
ALLOW_LATE_JOIN=1

; Segundos extras de atraso aceitos quando ALLOW_LATE_JOIN=1
LATE_JOIN_GRACE_SEC=1800

[Teleport]
; -----------------------------------------------------------------------------
; Como ENTRAR na zona do PvP Event
; -----------------------------------------------------------------------------
; TELEPORT_MODE:
;   ITEM   = usa item (Book) e clica nos botoes do menu
;   NPC    = anda ate o Gatekeeper (GATE_NPC_*) e abre dialogo
;   BYPASS = comando/bypass do servidor (TELEPORT_BYPASS)
;   NONE   = nao teleporta (ja deve estar na zona)
TELEPORT_MODE=ITEM

; Texto do bypass (so se MODE=BYPASS). Ex.: .pvpjoin
TELEPORT_BYPASS=

; --- Entrada por ITEM (Book Teleport / Global Gatekeeper) ---

; ID do item no inventario (Impact Book = 5588)
TELEPORT_ITEM_ID=5588

; Nome do item (fallback se o ID nao achar)
TELEPORT_ITEM_NAME=Tutorial Guide

; Espera apos abrir o item antes de clicar o menu (ms)
TELEPORT_ITEM_OPEN_DELAY_MS=1500

; Botoes do menu, na ordem. Virgula = passos.
; Impact: Global Gatekeeper -> botao [PvP Event]
TELEPORT_MENU_BUTTONS=PvP Event, 1|

; Indice do botao quando ha varios iguais (quase sempre 1)
TELEPORT_MENU_BUTTON_INDEX=1

; Pausa entre cliques de menu (ms)
TELEPORT_MENU_BUTTON_DELAY_MS=1200

; --- Entrada por NPC / Gatekeeper no chao (so se MODE=NPC) ---

; ID do NPC Gatekeeper (0 = desligado / use ITEM)
GATE_NPC_ID=0

; Coordenadas do NPC (pra achar/aproximar)
GATE_NPC_X=0
GATE_NPC_Y=0
GATE_NPC_Z=0

; Distancia pra considerar "perto o bastante" do NPC
GATE_APPROACH_DIST=80

; Raio maximo de busca do NPC no mapa
GATE_MAX_SEARCH_DIST=3000

; Espera apos abrir o dialogo do NPC (ms)
GATE_DIALOG_OPEN_DELAY_MS=1500

; Intervalo entre moves ate o NPC (ms)
GATE_MOVE_DELAY_MS=2000

; Tempo maximo esperando o TP completar (ms). 90000 = 90s
ARRIVAL_TIMEOUT_MS=90000

; Quantas vezes tenta o teleporte antes de falhar o slot
MAX_TELEPORT_ATTEMPTS=6

[Giran]
; -----------------------------------------------------------------------------
; Referencia de "cidade" — usado pra saber se SAIU / VOLTOU
; -----------------------------------------------------------------------------
; Se o char esta perto destas coords = esta em Giran (NAO esta na zona do evento).
; Fora desse raio = considerado na zona do PvP Event (area random).

GIRAN_X=82648
GIRAN_Y=148280
GIRAN_Z=-3464

; Raio em unidades do jogo pra considerar "em Giran"
GIRAN_RADIUS=5000

[Zone]
; -----------------------------------------------------------------------------
; Area do PvP Event (IMPORTANTE pro EXIT)
; -----------------------------------------------------------------------------
; Fique no evento e anote /loc (ou use o centro da arena).
; Com ZONE preenchida:
;   - "esta no evento" = perto destas coords (raio ZONE_RADIUS)
;   - EXIT so termina quando SAIR deste raio (ou chegar em Giran)
; Sem ZONE (0,0): qualquer mapa fora de Giran conta como zona (menos preciso).
ZONE_X=8661
ZONE_Y=-23502
ZONE_Z=-3720
; Raio grande o bastante pra cobrir TODA a arena
ZONE_RADIUS=15000

[Event]
; -----------------------------------------------------------------------------
; Duracao da luta DENTRO da zona (depois de entrar)
; -----------------------------------------------------------------------------
; Conta a partir do momento que confirma a zona — NAO e a janela de agenda.
; 1200 = 20 min | 1800 = 30 min | 900 = 15 min
EVENT_DURATION_SEC=1790

[Combat]
; -----------------------------------------------------------------------------
; Como escolhe e trava o alvo (players)
; -----------------------------------------------------------------------------

; TARGET_MODE — como escolher alvo QUANDO ninguem esta em "execucao":
;   LOWEST_HP = menor CurHP (vida atual absoluta) — recomendado
;   NEAREST   = player mais perto de voce
TARGET_MODE=LOWEST_HP

; Distancia maxima (unidades) pra considerar um player como alvo
TARGET_RANGE=1300

; Intervalo pra reavaliar quem e o melhor alvo (ms).
; Maior = mais estavel (menos troca louca) | Menor = reage mais rapido
TARGET_RESCAN_MS=500

; Tempo minimo segurando um alvo antes de trocar por HP/distancia (ms).
; Evita ficar pulando de player em player.
TARGET_STICKY_MS=2500

; Margem pra aceitar troca no modo LOWEST_HP (CurHP absoluto).
; Ex.: 200 = so troca se o outro tiver pelo menos 200 HP a menos
SWITCH_HP_MARGIN=200

; Margem pra aceitar troca no modo NEAREST (distancia)
SWITCH_DIST_MARGIN=150

; NAO anda ate o target durante o fight (fica feio trocando e andando).
; Com alvo: so mira + skills no lugar.
; Sem alvo: pode andar pro CENTER (se ENABLE_CENTER_MOVE=1).

; --- EXECUCAO (igual ultimoPVP / L2Coyote-PVP) ---

; FOCUS_LOW_HP_PCT = gatilho de "matar peixe":
;   Quando o alvo (ou alguém na range) esta com HP% <= este valor,
;   o bot TRAVA nele e NAO troca mais ate ele morrer / sair da range.
;   Usa percentual: CurHP / MaxHP * 100.
;   60 = trava em 60% ou menos | 30 = mais agressivo (so bem baixo)
;   0  = desliga a execucao (so usa TARGET_MODE normal)
FOCUS_LOW_HP_PCT=60

; 1 = trava no alvo ate matar (recomendado). Nao troca por outro peixe/HP.
LOCK_UNTIL_KILL=1

; Se JA esta em peixe, so troca pra outro peixe se estiver X% mais baixo.
; (ignorado se LOCK_UNTIL_KILL=1)
EXEC_SWITCH_PCT_MARGIN=100

; ATTACK_ONLY_ON_EXECUTION:
;   0 = ataca sempre (menor HP), e se aparecer peixe <= FOCUS trava nele
;   1 = NAO ataca ninguem ate achar alguem ja abaixo do FOCUS_LOW_HP_PCT
ATTACK_ONLY_ON_EXECUTION=0

; FINISH_PVP — espelha "Finalizar PVP" do Adrenaline.
;   So roda quando o script AINDA NAO tem alvo travado (nao briga com o lock).
;   1 = ligado | 0 = so nosso seletor de alvo
FINISH_PVP=1

; Range do Finish PVP (deve ser parecido com TARGET_RANGE)
FINISH_PVP_RANGE=1200

; FACE_CONTROL — Face Control Attack do Adrenaline na zona
;   1 = liga ao entrar em combate | 0 = nao mexe
FACE_CONTROL=1

[Skills]
; -----------------------------------------------------------------------------
; Skills de combate
; -----------------------------------------------------------------------------
; RECOMENDADO: deixe as teclas VAZIAS.
; O script so escolhe/trava o alvo + liga FaceControl Attack.
; As skills (Surrender, Vortex, Hurricane...) ficam na config de combate
; do Adrenaline (perfil Apollo que voce montou na tela).
;
; Se preencher F1/F2/F3, o script FORCA essas teclas (ignora a lista do bot).
SKILL_1_KEY=F1
SKILL_1_INTERVAL_MS=1

SKILL_2_KEY=F2
SKILL_2_INTERVAL_MS=0

SKILL_3_KEY=F3
SKILL_3_INTERVAL_MS=0

[Center]
; -----------------------------------------------------------------------------
; Andar pro centro da arena quando NAO tem alvo (opcional)
; -----------------------------------------------------------------------------

; 1 = se nao achar player, anda ate CENTER_X/Y/Z | 0 = fica parado esperando
ENABLE_CENTER_MOVE=0

; Coordenadas do centro da zona (so se ENABLE_CENTER_MOVE=1)
CENTER_X=10460
CENTER_Y=-24375
CENTER_Z=-3648

; Raio pra considerar "ja chegou no centro"
CENTER_RADIUS=5000

[Exit]
; -----------------------------------------------------------------------------
; Como VOLTAR pra Giran quando EVENT_DURATION_SEC acaba
; -----------------------------------------------------------------------------
; EXIT_MODE:
;   AUTO  = tenta Book; se NAO tiver o item, usa a GK da zona (recomendado)
;   ITEM  = so Book
;   NPC   = so Gatekeeper da arena
;   BYPASS / NONE
EXIT_MODE=ITEM

; Bypass de saida (so se MODE=BYPASS)
EXIT_BYPASS=

; --- Saida por ITEM (Book) ---
EXIT_ITEM_ID=5588
EXIT_ITEM_NAME=Book Teleport
EXIT_ITEM_OPEN_DELAY_MS=1500

; Menu de saida (Book E GK): Impact -> Giran -> teleporte 1
EXIT_MENU_BUTTONS=Giran City (Main), 1
EXIT_MENU_BUTTON_INDEX=1
EXIT_MENU_BUTTON_DELAY_MS=1200

; --- GK de saida DENTRO da arena PvP (fallback sem Book) ---
; Coords do Gatekeeper da zona (overlay /loc perto do NPC)
EXIT_GATE_NPC_ID=0
; Nome parcial opcional (ex.: Gatekeeper). Vazio = pega NPC mais perto das coords
EXIT_GATE_NPC_NAME=
EXIT_GATE_NPC_X=9891
EXIT_GATE_NPC_Y=-24689
EXIT_GATE_NPC_Z=-3754
EXIT_GATE_APPROACH_DIST=80
EXIT_GATE_MAX_SEARCH_DIST=5000
EXIT_GATE_DIALOG_OPEN_DELAY_MS=1500
EXIT_GATE_MOVE_DELAY_MS=2000

; Tentativas "base" de EXIT. Com EXIT_KEEP_RETRYING=1, se ainda estiver
; na ZONE depois disso, CONTINUA tentando (nao desiste) — tipico PvP
; onde o Book falha enquanto batem em voce.
MAX_EXIT_ATTEMPTS=8

; 1 = enquanto estiver na zona do evento, insiste no Book/GK ate sair
; 0 = apos MAX_EXIT_ATTEMPTS marca falha e para
EXIT_KEEP_RETRYING=1

; Intervalo entre tentativas de EXIT (ms). Em combate o Book falha muito;
; 4000 = tenta a cada ~4s ate sair da ZONE / chegar em Giran.
EXIT_RETRY_INTERVAL_MS=4000

[Loop]
; -----------------------------------------------------------------------------
; Ritmo interno do modulo (raramente precisa mudar)
; -----------------------------------------------------------------------------

; Intervalo minimo entre acoes do modulo (ms) — combate/TP/exit
SCAN_INTERVAL_MS=200

; A cada quanto loga "ainda esperando / combatando..." no modo DEV (ms)
WAIT_LOG_INTERVAL_MS=15000

; Intervalo entre Engine.MoveTo (centro / reposicionamento) (ms)
MOVE_INTERVAL_MS=1200
