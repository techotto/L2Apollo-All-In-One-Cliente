; =============================================================================
; L2Apollo — TVT (Team vs Team)
; =============================================================================
; Fluxo:
;   1) Horario -> manda JOIN_COMMAND (.tvtjoin)
;   2) Espera sair de Giran (entrou na arena)
;   3) Identifica time e ataca (TARGET_MODE: LOWEST_HP ou NEAREST)
;   4) Skills: F1 (prio) > F2 > F3
;   5) Evento acaba quando VOLTAR pra Giran
; =============================================================================

[Geral]
; Liga (1) ou desliga (0) o modulo TVT
ENABLED=1

[Schedule]
; Horarios do ANUNCIO / abertura (HH:MM)
TIMES=01:00, 03:00, 05:00, 07:00, 08:00, 09:00,  11:00, 12:00, 13:00, 16:00 , 18:15, 22:15, 23:06

; Segundos depois do horario para mandar o join
REGISTER_OFFSET_SEC=30

; Janela em que ainda tenta dar join (segundos)
REGISTER_WINDOW_SEC=300

ONCE_PER_SLOT=1

; 1 = pode dar .tvtjoin a qualquer momento da janela (recomendado)
; 0 = so nos primeiros LATE_JOIN_GRACE_SEC — Buffer/force costuma estourar isso
ALLOW_LATE_JOIN=1
LATE_JOIN_GRACE_SEC=45

[Join]
; Comando de chat pra entrar (ex.: .tvtjoin)
JOIN_COMMAND=.join

; SAY = Engine.Say | SAY_AND_VOICED = Say + bypass voiced_xxx (mais confiavel)
JOIN_METHOD=SAY_AND_VOICED

; Delay apos mandar o join (ms)
JOIN_DELAY_MS=2000

; Quantas vezes manda .join. 2 basta — o server confirma no chat.
MAX_JOIN_ATTEMPTS=2

; Minimo entre um .join e outro (ms). Sem isso o script spamava 5x em 10s
; porque ainda estava no farm (o TP da arena so vem quando a inscricao fecha).
JOIN_RETRY_MS=60000

[Giran]
; Coordenadas de Giran (fim do evento = voltou pra ca)
; Preencha com a posicao tipica onde voce nasce/volta
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470

; Distancia pra considerar que esta em Giran
GIRAN_RADIUS=10000

[Enemy]
; ---------------------------------------------------------------------------
; Como saber quem e do OUTRO time?
; ---------------------------------------------------------------------------
; TITLE_DIFF / TEAM (recomendado neste server — title "Team =POSEIDON=" / "Team =HADES=")
;   Le o title/name e compara time. Inimigo = key diferente (Poseidon x Hades, Red x Blue...).
;
; SPAWN_ALLY
;   Ao spawnar: ancora fixa (X,Y). Nos primeiros SPAWN_ALLY_LOCK_MS,
;   OID dentro de TEAM_INFER_RADIUS da ancora + party = ALIADOS (ignore).
;   Depois do lock: fora da lista = inimigo.
;
; ALL_PLAYERS = qualquer player (mata aliado tambem)
; CLAN_DIFF   = ClanID diferente
; ---------------------------------------------------------------------------
ENEMY_DETECT=TITLE_DIFF

; Janela pra mapear aliados no spawn (ms). Enquanto isso NAO ataca.
SPAWN_ALLY_LOCK_MS=6000

; 0 = so ataca se time/cor/lista identificar o OUTRO lado (padrao seguro)
; 1 = se nao achar, usa Attackable — PERIGOSO
ATTACKABLE_FALLBACK=0

; Offsets do CharInfo/UserInfo (ainda usados se COLOR_PACKET / fallback)
PACKET_CHARINFO_SIZE=356
PACKET_CHARINFO_OID=16
PACKET_CHARINFO_NAMECOLOR=332
PACKET_CHARINFO_TITLECOLOR=348
PACKET_USERINFO_OID=18
PACKET_USERINFO_NAMECOLOR=316
PACKET_USERINFO_TITLECOLOR=332
PACKET_USERINFO_MIN_SIZE=312

; Range pra procurar inimigos
TARGET_RANGE=4000

; Como escolher o alvo:
;   LOWEST_HP = menor HP (padrao)
;   NEAREST   = mais proximo
TARGET_MODE=NEAREST

; Intervalo pra reavaliar alvo (ms) — lock mantem o mesmo alvo entre rescans
; 250 = troca rapida apos kill; abaixo de 150 o validate sobe pra 150
TARGET_RESCAN_MS=250

; Busca agressiva do oponente ao entrar na arena (ms)
ARENA_KICKSTART_MS=1500

; Raio pra inferir SEU time pelos vizinhos no spawn
TEAM_INFER_RADIUS=1800

[Skills]
; Teclas em ordem de PRIORIDADE (1o = mais importante)
; F1 sempre que o CD interno permitir; senao F2; senao F3
SKILL_1_KEY=F1
SKILL_1_INTERVAL_MS=30

SKILL_2_KEY=F2
SKILL_2_INTERVAL_MS=60

SKILL_3_KEY=F3
SKILL_3_INTERVAL_MS=90

[Safety]
; Se deu join e ficou X segundos SEM TP (so vale DEPOIS que a janela fechou
; + ARENA_AFTER_WINDOW_SEC). Enquanto a inscricao esta aberta, espera.
IDLE_ABORT_SEC=180

; Distancia do ponto do .join pra considerar que teleportou pra arena
ARENA_TELEPORT_DIST=3000

; Depois que a inscricao fecha ("5 minute(s) till registrations close"),
; o server TP pra arena. Espera estes segundos antes de desistir.
ARENA_AFTER_WINDOW_SEC=90

; Fim do TVT em outra cidade: time sumiu N s → EXIT (item/SoE)
END_NO_TEAM_SEC=5
EXIT_WAIT_COMBAT_SEC=30
MAX_EXIT_ATTEMPTS=6

[Exit]
; Como SAIR da arena (Scroll of Escape, Book, bypass, buffer.ini fallback)
; AUTO = tenta EXIT_ITEM; senao usa buffer.ini [Return]
; ITEM = so item (SoE: deixe EXIT_MENU_BUTTONS vazio)
EXIT_MODE=AUTO
EXIT_BYPASS=
EXIT_ITEM_ID=0
EXIT_ITEM_NAME=Scroll of Escape
EXIT_ITEM_OPEN_DELAY_MS=800
EXIT_MENU_BUTTONS=
EXIT_MENU_BUTTON_INDEX=1
EXIT_MENU_BUTTON_DELAY_MS=1200
EXIT_DETECT_LEAVE_ZONE=1
EXIT_MOVE_SUCCESS_DIST=3000
EXIT_KEEP_RETRYING=1
EXIT_RETRY_INTERVAL_MS=4000

[Loop]
SCAN_INTERVAL_MS=150
WAIT_LOG_INTERVAL_MS=8000

; Anti-AFK: passo curto a cada X s (espera TP / sem alvo / sair de combate)
ENABLE_WANDER=1
WANDER_EVERY_SEC=8
WANDER_OFFSET=120
WANDER_PULSE_MS=400
