; =============================================================================
; L2Apollo — TVT (Team vs Team)
; =============================================================================
; Fluxo:
;   1) Horario -> manda JOIN_COMMAND (.tvtjoin)
;   2) Espera sair de Giran (entrou na arena)
;   3) Identifica time e ataca (TARGET_MODE: LOWEST_HP ou NEAREST)
;   4) Skills: F1 (prio) > F2 > F3
;   5) Evento acaba quando VOLTAR pra Giran
; =============================================================================

[Geral]
; Liga (1) ou desliga (0) o modulo TVT
ENABLED=1

[Schedule]
; Horarios do ANUNCIO / abertura (HH:MM)
TIMES=07:38, 09:38, 11:38, 13:38, 15:39, 17:40, 19:39, 21:38, 23:38

; Segundos depois do horario para mandar o join
REGISTER_OFFSET_SEC=30

; Janela em que ainda tenta dar join (segundos)
REGISTER_WINDOW_SEC=300

ONCE_PER_SLOT=1

; 1 = pode dar .tvtjoin a qualquer momento da janela (recomendado)
; 0 = so nos primeiros LATE_JOIN_GRACE_SEC — Buffer/force costuma estourar isso
ALLOW_LATE_JOIN=1
LATE_JOIN_GRACE_SEC=45

[Join]
; Comando de chat pra entrar (ex.: .tvtjoin)
JOIN_COMMAND=.join

; SAY = Engine.Say | SAY_AND_VOICED = Say + bypass voiced_xxx (mais confiavel)
JOIN_METHOD=SAY_AND_VOICED

; Delay apos mandar o join (ms)
JOIN_DELAY_MS=2000

; Quantas vezes manda .join. 2 basta — o server confirma no chat.
MAX_JOIN_ATTEMPTS=2

; Minimo entre um .join e outro (ms). Sem isso o script spamava 5x em 10s
; porque ainda estava no farm (o TP da arena so vem quando a inscricao fecha).
JOIN_RETRY_MS=60000

[Giran]
; Coordenadas de Giran (fim do evento = voltou pra ca)
; Preencha com a posicao tipica onde voce nasce/volta
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470

; Distancia pra considerar que esta em Giran
GIRAN_RADIUS=10000

[Enemy]
; ---------------------------------------------------------------------------
; Como saber quem e do OUTRO time?
; ---------------------------------------------------------------------------
; SPAWN_ENEMY (recomendado neste server — nicks iguais / sem cor de time)
;   Ao entrar na arena grava ancora (seu spawn).
;   Nos primeiros SPAWN_*_LOCK_MS, todo player com Dist(ancora) >= ENEMY_MIN_DIST
;   entra na lista de INIMIGOS por OID (nick/title nao importam).
;   Depois: so ataca OIDs dessa lista. TARGET_MODE=NEAREST = mais perto dela.
;
; SPAWN_ALLY = inverso: marca proximos como aliados; fora da lista = inimigo
; TITLE_DIFF / TEAM = User.Team / "Team Red|Blue" / cor nameplate
; ALL_PLAYERS = qualquer player na range (mata aliado tambem)
; CLAN_DIFF   = ClanID diferente
; ---------------------------------------------------------------------------
ENEMY_DETECT=SPAWN_ENEMY

; Distancia minima da ancora de spawn pra considerar INIMIGO (SPAWN_ENEMY).
; Times nascem em lados opostos — longe = outro time. Ajuste se a arena for
; menor/maior (comece ~1500-2500).
ENEMY_MIN_DIST=2400

; Janela (ms) apos entrar na arena pra montar a lista (SPAWN_ENEMY / SPAWN_ALLY)
SPAWN_ENEMY_LOCK_MS=5000

; Range pra procurar / engajar inimigos (apos a lista)
TARGET_RANGE=4000

; Como escolher o alvo DENTRO da lista de inimigos:
;   NEAREST   = mais proximo (recomendado com SPAWN_ENEMY)
;   LOWEST_HP = menor HP
TARGET_MODE=NEAREST

; Intervalo pra reavaliar alvo (ms)
TARGET_RESCAN_MS=300

; Raio pra inferir SEU time pelos vizinhos no spawn (SPAWN_ALLY / TITLE)
TEAM_INFER_RADIUS=1200

[Skills]
; Teclas em ordem de PRIORIDADE (1o = mais importante)
; F1 sempre que o CD interno permitir; senao F2; senao F3
SKILL_1_KEY=F1
SKILL_1_INTERVAL_MS=30

SKILL_2_KEY=F2
SKILL_2_INTERVAL_MS=60

SKILL_3_KEY=F3
SKILL_3_INTERVAL_MS=90

[Safety]
; Se deu join e ficou X segundos SEM TP (so vale DEPOIS que a janela fechou
; + ARENA_AFTER_WINDOW_SEC). Enquanto a inscricao esta aberta, espera.
IDLE_ABORT_SEC=180

; Distancia do ponto do .join pra considerar que teleportou pra arena
ARENA_TELEPORT_DIST=3000

; Depois que a inscricao fecha ("5 minute(s) till registrations close"),
; o server TP pra arena. Espera estes segundos antes de desistir.
ARENA_AFTER_WINDOW_SEC=90

; Fim do TVT em outra cidade (ex. Goddard): time sumiu N s → RETURN pra Giran
END_NO_TEAM_SEC=5
EXIT_WAIT_COMBAT_SEC=30
MAX_EXIT_ATTEMPTS=6

[Loop]
SCAN_INTERVAL_MS=150
WAIT_LOG_INTERVAL_MS=8000

; Anti-AFK: passo curto a cada X s (espera TP / sem alvo / sair de combate)
ENABLE_WANDER=1
WANDER_EVERY_SEC=8
WANDER_OFFSET=120
WANDER_PULSE_MS=400
[AutoFarm]
; Tapumes: 0 = comportamento atual do script | 1 = deixa so o AutoFarm do SV
; Bloqueia Engine.Attack / Face / skills de combate do script
AF_BLOCK_ATTACK=1
; Bloqueia SetTarget / SetTargetID / Action(Ctrl) do script
AF_BLOCK_TARGET=1
