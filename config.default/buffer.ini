; =============================================================================
; L2Apollo — BUFFER (Giran)
; =============================================================================
; Usado ANTES de todo evento e se algum buff monitorado sumir.
; Ideia extraida do l2Coyote-Farmer (so a parte de buffer + walk + unstuck).
; =============================================================================

[Geral]
ENABLED=1

; 1 = mesmo com buff OK, visita o NPC antes de cada evento novo
FORCE_BEFORE_EVENT=1

[Giran]
; Pra saber se ja esta na cidade / chegou do return
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470
GIRAN_RADIUS=4000

[Npc]
BUFFER_NPC_ID=40001
BUFFER_NPC_X=83647
BUFFER_NPC_Y=148402
BUFFER_NPC_Z=-3408
; Distancia pra FALAR com o NPC (abrir dialogo)
BUFFER_NPC_APPROACH_DIST=80

; Distancia maxima pra considerar o NPC "no radar" (nao e pra abrir dialogo)
BUFFER_NPC_MAX_SEARCH_DIST=2500
BUFFER_DIALOG_OPEN_DELAY_MS=1500
BUFFER_BUTTON_DELAY_MS=1200

; Sequencia de cliques no menu do buffer
; Formato: Texto,Index | Texto,Index | ...
BUFFER_ROUTE= Use, 1 | Mage, 1 |  Back, 1| Heal, 1

[Walk]
; Caminho ate o buffer (ultimo ponto perto do NPC).
; Formato: x,y,z|x,y,z|...
; Latin: NPC em 83647,148402 — NAO usar WP do Giran padrao (83150 puxava pra longe).
; Staging ao sul do buffer + approach com spread no script (evita empilhar no NPC).
WALK_TO_BUFFER=83540,148520,-3408
WALK_STEP_DELAY_MS=800

[Movement]
; Desviar se travar em parede/player (Giran lotado / servidor lagado).
; Se ficar no MESMO XYZ por POSITION_STUCK_MS: tenta BACK/L/R
; ate SAIR daquele XYZ, depois retoma o caminho.
ENABLE_UNSTUCK=1
UNSTUCK_OFFSET=300
UNSTUCK_OFFSET_STEP=120
UNSTUCK_SETTLE_MS=350
STUCK_TIMEOUT_MS=2000
; Mesma posicao (~MIN_MOVE) por este tempo → desvia L/R/tras
POSITION_STUCK_MS=1500
MAX_UNSTUCK_TRIES=8
CHECK_INTERVAL_MS=300
; Distancia pra waypoints. NPC usa ApproachDist+40 (nao este valor).
ARRIVE_DIST=60
MIN_MOVE=30
; Lado livre do NPC (conta players no raio) — mesma tecnica do Farm GK
CROWD_SCAN=250

[RequiredBuffs]
; Buffs que DEVEM estar ativos (TODOS).
; Formato de cada item: Nome  OU  ID  OU  ID:Nome
; Separados por |
; Ex.: Wind Walk|1204  ou  1204:Wind Walk|1086:Haste
REQUIRED_BUFFS=1204:Wind Walk

; Se restar menos que isso (ms), considera que precisa rebuf (0 = so quando sumir)
MIN_BUFF_REMAIN_MS=0

; Intervalo pra checar buffs quando JA esta OK (ms).
; Se FALTAR buff em Giran, o script bufa quase na hora (~1s).
BUFF_CHECK_INTERVAL_MS=5000

[Return]
; Como VOLTAR pra Giran se estiver fora (evento / mapa) sem buff
; NONE | BYPASS | ITEM | NPC
RETURN_MODE=ITEM

RETURN_BYPASS=
; Mesmo Book Teleport do Tournament / PvP Farm (ID evita falha por nome)
RETURN_ITEM_ID=12610
RETURN_ITEM_NAME=Durendal
RETURN_ITEM_OPEN_DELAY_MS=1500
RETURN_MENU_BUTTONS=Giran, 1|
RETURN_MENU_BUTTON_INDEX=1
RETURN_MENU_BUTTON_DELAY_MS=1200

; Se RETURN_MODE=NPC
RETURN_GATE_NPC_ID=0
RETURN_GATE_NPC_X=0
RETURN_GATE_NPC_Y=0
RETURN_GATE_NPC_Z=0
RETURN_GATE_APPROACH_DIST=80
RETURN_GATE_MAX_SEARCH_DIST=3000
RETURN_GATE_DIALOG_OPEN_DELAY_MS=1500
RETURN_GATE_MOVE_DELAY_MS=2000

[Safety]
MAX_BUFFER_ATTEMPTS=3
VALIDATE_WAIT_MS=2000

[Shots]
; Liga SS / SPS em TODOS os eventos (TVT, KTB, Farm, Tour...) e apos buffar
; Re-checa a cada SHOT_CHECK_INTERVAL_MS se desligou
; IMPORTANTE: AUTO_SOULSHOT_NAME deve bater com o nome EXATO do inventario.
; Se nao souber o nome, coloque o ID em AUTO_SOULSHOT_ITEM_ID (mais confiavel).
ENABLE_AUTO_SOULSHOT=0
AUTO_SOULSHOT_NAME=Soulshot: S-grade Infinite (S)
AUTO_SOULSHOT_ITEM_ID=0

ENABLE_AUTO_SPIRITSHOT=1
AUTO_SPIRITSHOT_NAME=Blessed Spiritshot: S Grade 
AUTO_SPIRITSHOT_ITEM_ID=0

SHOT_CHECK_INTERVAL_MS=5000
