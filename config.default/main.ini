; =============================================================================
; L2Apollo-All-In-One — MAIN (orquestrador)
; =============================================================================
; Este arquivo so decide QUAIS modulos rodam, o ritmo do loop e o nivel de log.
; Cada evento tem o proprio .ini em config/ (horarios, NPC, teleporte...).
; =============================================================================

[Geral]
; Slug do produto para IPC com o Guard (deve bater com products.json)
PRODUCT_IPC_SLUG=allinone

; Prefixo das mensagens no chat do Adrenaline
LOG_TAG=L2Apollo

; Intervalo do loop principal do orquestrador (ms)
TICK_MS=1000

; Pasta dos .ini dos modulos (relativa ao BaseDir)
CONFIG_DIR=config

; ---------------------------------------------------------------------------
; Nivel de log (pro cliente use CLIENT)
;   CLIENT = so o essencial (breve) — recomendado na entrega
;   DEV    = tudo (teleporte, waits, bypass, banner completo)
;   OFF    = quase silencioso (ainda mostra erros)
; ---------------------------------------------------------------------------
LOG_MODE=CLIENT

; Atualiza o painel de status no chat a cada X segundos (countdown do proximo evento)
STATUS_LOG_INTERVAL_SEC=60

; Delays padrao de dialogo (modulos podem sobrescrever o uso interno)
DIALOG_CLOSE_DELAY_MS=400
DIALOG_BUTTON_DELAY_MS=1200

; ---------------------------------------------------------------------------
; Watchdog global (qualquer modulo): parado fora de Giran -> volta pelo
; RETURN_* do buffer.ini (ITEM Book / GK / bypass — o que estiver configurado).
; Movimento, combate, morte ou ja estar em Giran zeram o timer.
; ---------------------------------------------------------------------------
[IdleReturn]
IDLE_RETURN=1
IDLE_RETURN_SEC=180
IDLE_RETURN_MIN_MOVE=50
IDLE_RETURN_COOLDOWN_SEC=45

[Modules]
; 1 = ativo | 0 = desligado
; Prioridade alta → baixa:
;   Tour / TVT / KTB / SoloBoss / PvP Event  >  PvP Farm  >  Farm
; Farm = spot idle (so quando nenhum evento esta rodando)
; PvP Event: ligue apos preencher TIMES em config/pvpevent.ini
BUFFER=1
TOURNAMENT=1
TVT=1
KTB=1
SOLOBOSS=1
PVPEVENT=1
PVPFARM=1
FARM=1
