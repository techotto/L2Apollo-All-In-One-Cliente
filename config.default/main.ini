; =============================================================================
; L2Apollo-All-In-One — MAIN (orquestrador)
; =============================================================================
; Este arquivo so decide QUAIS modulos rodam, o ritmo do loop e o nivel de log.
; Cada evento tem o proprio .ini em config/ (horarios, NPC, teleporte...).
; =============================================================================

[Geral]
; Slug do produto para IPC com o Guard (deve bater com products.json)
PRODUCT_IPC_SLUG=allinone

; Prefixo das mensagens no chat do Adrenaline
LOG_TAG=L2Apollo

; Intervalo do loop principal do orquestrador (ms)
TICK_MS=1000

; Pasta dos .ini dos modulos (relativa ao BaseDir)
CONFIG_DIR=config

; ---------------------------------------------------------------------------
; Nivel de log (pro cliente use CLIENT)
;   CLIENT = so o essencial (breve) — recomendado na entrega
;   DEV    = tudo (teleporte, waits, bypass, banner completo)
;   OFF    = quase silencioso (ainda mostra erros)
; ---------------------------------------------------------------------------
LOG_MODE=CLIENT

; Atualiza o painel de status no chat a cada X segundos (countdown do proximo evento)
STATUS_LOG_INTERVAL_SEC=60

; Painel L2ApolloPanel.dll (Script.StartPlugin). 1=abre | 0=so chat
GUI=1

; ---------------------------------------------------------------------------
; Oculta OUTROS players so no teu client enquanto estiver em Giran
; (coords GIRAN_* do buffer.ini). O server nao muda; os outros te veem.
; Sai de Giran / entra em TVT-Tour-KTB-PvP = mostra de novo.
; Quem ja estava na tela some no proximo TP, relog ou sair e voltar.
; ---------------------------------------------------------------------------
HIDE_PLAYERS_GIRAN=1
; Opcodes S->C de spawn de player (virgula). Interlude/C6: 0x03=CharInfo.
; High Five/Gracia usam 0x31. Nao use 0x04 (voce) nem 0x16 (NPC).
; Teste rapido da API: ponha 0x4A (chat) — se o chat sumir, o bloqueio funciona.
HIDE_PLAYERS_PACKETS=0x03
; 4o parametro do BlockPacket = quantidade de pacotes a descartar.
; 0 = automatico (usa 1000000, renovado enquanto o filtro estiver ligado).
HIDE_PLAYERS_BLOCK_ARG=0
; Como ocultar: 1=so BlockPacket | 2=so injetar DeleteObject | 3=os dois.
; O modo 2/3 apaga tambem quem ja estava desenhado na tela.
HIDE_PLAYERS_MODE=2
; Opcode do DeleteObject. Interlude/C6 = 0x12.
HIDE_PLAYERS_DELETE_OPCODE=0x12

; ---------------------------------------------------------------------------
; Auto-attack silent da interface (ALT+S). Igual SS/BSS: ao ENTRAR no mundo
; (login, relog, fechou e abriu o client) o script aperta ALT+S uma vez.
; ---------------------------------------------------------------------------
AUTO_ATTACK_INTERFACE=1
; Segundos de espera apos entrar no mundo (UI carregar). Relog costuma precisar ~10s.
AUTO_ATTACK_INTERFACE_DELAY_SEC=10

; ---------------------------------------------------------------------------
; Voltar pra vila ao morrer. GoHome do Adrenaline antigo quase nunca funciona.
; Ordem: HTML de morte (se aberto) -> pacote capturado em hex ESPACADO
; -> bypass. Nao dispara dentro de Tour/TVT/KTB/SoloBoss/PvP Event.
; ---------------------------------------------------------------------------
DEATH_TO_VILLAGE=0
DEATH_TO_VILLAGE_USE_GOHOME=0
DEATH_TO_VILLAGE_OPCODE=0x6D
; 0=vila | 1=clan hall | 2=castelo | 3=fortaleza
DEATH_TO_VILLAGE_POINT=0
DEATH_TO_VILLAGE_DELAY_TICKS=2
; Hex gravado pelo botao "Capturar ToV". Clique To Village morto e deixe
; a captura pegar TODOS os C->S (6D nativo E bypass HTML 0x21).
; DEATH_TO_VILLAGE_PACKETS=
; DEATH_TO_VILLAGE_BYPASS=

; Delays padrao de dialogo (modulos podem sobrescrever o uso interno)
DIALOG_CLOSE_DELAY_MS=400
DIALOG_BUTTON_DELAY_MS=1200

; ---------------------------------------------------------------------------
; Watchdog global (qualquer modulo): parado fora de Giran -> volta pelo
; RETURN_* do buffer.ini (ITEM Book / GK / bypass — o que estiver configurado).
; Movimento, combate, morte ou ja estar em Giran zeram o timer.
; ---------------------------------------------------------------------------
[IdleReturn]
IDLE_RETURN=1
IDLE_RETURN_SEC=180
IDLE_RETURN_MIN_MOVE=50
IDLE_RETURN_COOLDOWN_SEC=45

[Modules]
; 1 = ativo | 0 = desligado
; Prioridade alta → baixa:
;   Tour / TVT / KTB / SoloBoss / PvP Event  >  PvP Farm  >  Farm
; Farm = spot idle (so quando nenhum evento esta rodando)
; PvP Event: ligue apos preencher TIMES em config/pvpevent.ini
BUFFER=1
TOURNAMENT=0
TVT=0
KTB=0
SOLOBOSS=1
PVPEVENT=0
PVPFARM=0
FARM=1
DEATH_TO_VILLAGE_PACKETS=6D00000000
