; =============================================================================
; L2Apollo â€” PvP Farm (prioridade BAIXA)
; =============================================================================
; Fluxo:
;   1) Horario -> teleporta / GK / ou so espera (MODE=NONE + path no Adrenaline)
;   2) Chega na zona -> busca mobs em range GRANDE (5000+)
;   3) Ataca conforme COMBAT_PRIORITY (FARM / PVP / mistos)
;   4) Se Tour/TVT/KTB abrir -> cede NA HORA (join em combate ok).
;      Limpar agro (mobs te atacando) acontece no TP real do evento.
;      Finalizar alvo so quando for TELEPORTAR (item/GK).
;   5) Janela fecha -> para de farmar (slot feito)
;
; Prioridade: abaixo so do Farm idle. Evento alto cancela o PvP Farm na hora.
; =============================================================================

[Geral]
ENABLED=1

; Numero so documental (orquestrador ja trata Tour/TVT/KTB > PvP Farm)
PRIORITY=1

[Schedule]
; Aberturas do teleporte / janela de farm (HH:MM)
TIMES=01:10,08:10,10:10,14:10,18:10,23:30

; Comeca assim que o horario bate
REGISTER_OFFSET_SEC=0

; Duracao do evento = 30 min â€” pode teleportar a qualquer momento enquanto estiver aberto
REGISTER_WINDOW_SEC=1800

; 1 = no maximo 1 ida por horario | 0 = se voltou pra cidade ainda na janela, reentra
ONCE_PER_SLOT=0

; 1 = pode entrar no meio da janela (recomendado â€” TP fica aberto o evento todo)
ALLOW_LATE_JOIN=1
LATE_JOIN_GRACE_SEC=45

[Teleport]
; Como IR pro local: NONE | BYPASS | ITEM | NPC
; Mesmo item do Tournament (Book Teleport) â€” so muda o botao do menu
TELEPORT_MODE=NPC

TELEPORT_BYPASS=

TELEPORT_ITEM_ID=5588
TELEPORT_ITEM_NAME=Book Teleport
TELEPORT_ITEM_OPEN_DELAY_MS=1500

; Menu: clica "PvP Farm" (mesmo HTML do Tournament Zone)
TELEPORT_MENU_BUTTONS=TP 7,1
TELEPORT_MENU_BUTTON_INDEX=1
TELEPORT_MENU_BUTTON_DELAY_MS=1200

; Se TELEPORT_MODE=NPC
GATE_NPC_ID=9901
GATE_NPC_X=83403
GATE_NPC_Y=147907
GATE_NPC_Z=-3408
GATE_APPROACH_DIST=80
GATE_MAX_SEARCH_DIST=3000
GATE_DIALOG_OPEN_DELAY_MS=1500
GATE_MOVE_DELAY_MS=2000

[Giran]
; Pra saber se ainda esta na cidade
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470
GIRAN_RADIUS=10000

; PvP Farm e RANDOM â€” NAO preencha ZONE aqui (deixa 0).
; O spot do Farm idle fica SO em farm.ini (ZONE_*).
; Logica: "chegou no PvP" = fora de Giran E fora do ZONE do farm.ini.
;ZONE_X=0
;ZONE_Y=0
;ZONE_Z=0
;ZONE_RADIUS=5000
ZONE_X=0
ZONE_Y=0
ZONE_Z=0
ZONE_RADIUS=0

; Timeout da espera de chegada apos teleporte (ms) â€” so se ZONE_* != 0
ARRIVAL_TIMEOUT_MS=60000

; Tentativas de teleporte se nao sair de Giran / Farm idle
MAX_TELEPORT_ATTEMPTS=3
; Saida: NONE=TP auto | ITEM | NPC | BYPASS
RETURN_MODE=NONE
RETURN_BYPASS=
RETURN_ITEM_ID=5588
RETURN_ITEM_NAME=Book Teleport
RETURN_ITEM_OPEN_DELAY_MS=1500
RETURN_MENU_BUTTONS=Giran,1
RETURN_MENU_BUTTON_INDEX=1
RETURN_MENU_BUTTON_DELAY_MS=1200
RETURN_ARRIVAL_TIMEOUT_MS=20000
RETURN_GATE_NPC_ID=0
RETURN_GATE_NPC_X=0
RETURN_GATE_NPC_Y=0
RETURN_GATE_NPC_Z=0
RETURN_GATE_APPROACH_DIST=80
RETURN_GATE_MAX_SEARCH_DIST=3000
RETURN_GATE_DIALOG_OPEN_DELAY_MS=1500
RETURN_GATE_MOVE_DELAY_MS=2000
MAX_EXIT_ATTEMPTS=3
EXIT_AUTO_WAIT_SEC=20

[Combat]
; O que priorizar na zona PvP Farm:
;   ADRENALINE     = combate = Face Control / skills do Adrenaline
;                    + interrupt de player (abaixo) mesmo assim
;   FARM           = so mobs (script controla alvo)
;   PVP            = so players (script controla alvo)
;   PVP_THEN_FARM  = player se tiver; senao mob
;   FARM_THEN_PVP  = mob se tiver; senao player
COMBAT_PRIORITY=ADRENALINE

; Se alguem VIRAR pra te atacar (Target=voce): larga o mob e revida NA HORA.
; Funciona tambem com COMBAT_PRIORITY=ADRENALINE.
INTERRUPT_ON_PLAYER=1

; 1 = qualquer player na range interrompe (mais agressivo)
; 0 = so quem esta te atacando (recomendado)
INTERRUPT_ANY_PLAYER=0

[Mobs]
; Range GRANDE â€” no PvP Farm os mobs ficam longe as vezes
MOB_SEARCH_RANGE=15000

; Range pra achar players (interrupt / PVP_*)
PLAYER_SEARCH_RANGE=5000

; Opcional: filtrar por ID (0 = qualquer) e/ou nome parcial
MOB_NPC_ID=0
MOB_NAME=

; Distancia pra aproximar do mob
MOB_APPROACH_DIST=150

; So re-move se ficar mais longe que APPROACH + slack
MOB_REPOSITION_SLACK=40

; 1 = ignora NPCs de servico tipicos (se voce listar em IGNORE_NPC_IDS)
IGNORE_NPC_IDS=

[Skills]
; Com COMBAT_PRIORITY=ADRENALINE: ignore isto â€” use a lista de habilidades
; do Adrenaline (CHAR/MOB, range, etc.).
; So preencha KEY se o SCRIPT for atacar (FARM / PVP / mistos).
;SKILL_1_KEY=F1
;SKILL_1_INTERVAL_MS=800
;SKILL_2_KEY=F2
;SKILL_2_INTERVAL_MS=1200
;SKILL_3_KEY=F3
;SKILL_3_INTERVAL_MS=1600

[Safety]
; Sem mob / sem progresso por X segundos -> loga (nao aborta sozinho; espera janela)
IDLE_WARN_SEC=90

; Mesmo alvo X seg sem HP cair -> cancela e troca (0 = desliga)
; Apos ToV o script limpa alvo antigo â€” nao precisa esperar isso pra retomar.
STUCK_TARGET_SEC=3
; Quanto tempo ignora o OID antigo apos trocar
STUCK_IGNORE_SEC=8

; Sem causar dano no alvo por X seg -> volta pra Giran e re-teleporta
; (mesmo TELEPORT_* do ini), enquanto a JANELA do evento estiver aberta.
; 0 = desliga. Default 240 = 4 min.
NO_HIT_EXIT_SEC=240

[Loop]
; Menor = reage mais rapido a player te atacando / revive
SCAN_INTERVAL_MS=80
WAIT_LOG_INTERVAL_MS=15000
MOVE_INTERVAL_MS=1200
TARGET_RESCAN_MS=100
