; =============================================================================
; L2Apollo — PvP Farm (prioridade BAIXA)
; =============================================================================
; Fluxo:
;   1) Horario -> teleporta / GK / ou so espera (MODE=NONE + path no Adrenaline)
;   2) Chega na zona -> busca mobs em range GRANDE (5000+)
;   3) Ataca conforme COMBAT_PRIORITY:
;        MOB       = so mobs
;        RETALIATE = farm mobs; tomou hit -> vira no player e tenta matar
;        PLAYERS   = so players (mesmo sem flag, igual TVT)
;   4) Janela fecha:
;        - se o server ja mandou pra Giran = acabou
;        - senao usa [Return] (item / GK / bypass)
;   5) Se Tour/TVT/KTB abrir -> cede NA HORA.
;
; Prioridade: abaixo so do Farm idle. Evento alto cancela o PvP Farm na hora.
; =============================================================================

[Geral]
ENABLED=1

; Numero so documental (orquestrador ja trata Tour/TVT/KTB > PvP Farm)
PRIORITY=1

[Schedule]
; Aberturas do teleporte / janela de farm (HH:MM)
; Servidor COM horario: 01:10,08:10,14:10,...
; Servidor 24h: deixe VAZIO  ou  TIMES=24H  ou  ALWAYS_ON=1
;   (nao deixe uma lista de horarios se o PvP Farm e o dia todo)
TIMES=08:20,15:20,23:10
ALWAYS_ON=0

; Comeca assim que o horario bate
REGISTER_OFFSET_SEC=0

; Duracao de CADA janela (seg). 1800 = 30 min.
; Com ALWAYS_ON / TIMES vazio o script forca 86400 (o dia todo).
REGISTER_WINDOW_SEC=1800

; 1 = no maximo 1 ida por horario | 0 = se voltou pra cidade ainda na janela, reentra
ONCE_PER_SLOT=0

; 1 = pode entrar no meio da janela (recomendado — TP fica aberto o evento todo)
ALLOW_LATE_JOIN=1
LATE_JOIN_GRACE_SEC=1800

[Teleport]
; Como IR pro local: NONE | BYPASS | ITEM | NPC
; Mesmo item do Tournament (Book Teleport) — so muda o botao do menu
TELEPORT_MODE=ITEM

TELEPORT_BYPASS=

TELEPORT_ITEM_ID=5588
TELEPORT_ITEM_NAME=Book Teleport
TELEPORT_ITEM_OPEN_DELAY_MS=1500

; Menu: clica "PvP Farm" (mesmo HTML do Tournament Zone)
TELEPORT_MENU_BUTTONS=Farm Rush, 1
TELEPORT_MENU_BUTTON_INDEX=1
TELEPORT_MENU_BUTTON_DELAY_MS=1200

; Se TELEPORT_MODE=NPC
GATE_NPC_ID=0
GATE_NPC_X=0
GATE_NPC_Y=0
GATE_NPC_Z=0
GATE_APPROACH_DIST=80
GATE_MAX_SEARCH_DIST=3000
GATE_DIALOG_OPEN_DELAY_MS=1500
GATE_MOVE_DELAY_MS=2000

[Giran]
; Pra saber se ainda esta na cidade
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470
GIRAN_RADIUS=10000

; PvP Farm e RANDOM — NAO preencha ZONE aqui (deixa 0).
; O spot do Farm idle fica SO em farm.ini (ZONE_*).
; Logica: "chegou no PvP" = fora de Giran E fora do ZONE do farm.ini.
;ZONE_X=0
;ZONE_Y=0
;ZONE_Z=0
;ZONE_RADIUS=5000
ZONE_X=85512
ZONE_Y=-46072
ZONE_Z=-4640
ZONE_RADIUS=15000

; Timeout da espera de chegada apos teleporte (ms) — so se ZONE_* != 0
ARRIVAL_TIMEOUT_MS=60000

; Tentativas de teleporte se nao sair de Giran / Farm idle
MAX_TELEPORT_ATTEMPTS=3

[Return]
; SAIDA quando o evento acaba e o server NAO manda pra Giran sozinho.
; NONE  = espera o TP automatico (EXIT_AUTO_WAIT_SEC). Se ja estiver em Giran = acabou.
; ITEM  = usa o item e clica o menu (igual a entrada, so muda o botao)
; NPC   = fala com GK no spot — Capturar target no painel (Gatekeeper saida)
; BYPASS = comando direto
RETURN_MODE=NONE
RETURN_BYPASS=
RETURN_ITEM_ID=5588
RETURN_ITEM_NAME=Book Teleport
RETURN_ITEM_OPEN_DELAY_MS=1500
RETURN_MENU_BUTTONS=Giran,1
RETURN_MENU_BUTTON_INDEX=1
RETURN_MENU_BUTTON_DELAY_MS=1200
RETURN_ARRIVAL_TIMEOUT_MS=20000

; Se RETURN_MODE=NPC: clique o GK no spot -> Capturar target -> Salvar INI
RETURN_GATE_NPC_ID=0
RETURN_GATE_NPC_X=0
RETURN_GATE_NPC_Y=0
RETURN_GATE_NPC_Z=0
RETURN_GATE_APPROACH_DIST=80
RETURN_GATE_MAX_SEARCH_DIST=3000
RETURN_GATE_DIALOG_OPEN_DELAY_MS=1500
RETURN_GATE_MOVE_DELAY_MS=2000

MAX_EXIT_ATTEMPTS=3
; RETURN_MODE=NONE: espera estes segundos o server mandar pra Giran
EXIT_AUTO_WAIT_SEC=20

[Combat]
; 3 modalidades:
;   MOB       = so mobs (nao ataca player)
;   RETALIATE = farma mob; se TOMAR HIT, vira no player na hora e tenta matar
;               (mesmo player sem flag / Farm Rush)
;   PLAYERS   = so players, ignora mob
COMBAT_PRIORITY=MOB

; Range GRANDE — no PvP Farm os mobs ficam longe as vezes
MOB_SEARCH_RANGE=15000

; Range pra achar players (revidar / PLAYERS)
PLAYER_SEARCH_RANGE=5000

; 1 = qualquer player na range ja conta como interrupt (mais agressivo)
; 0 = so quem te bateu / quem tem Target em voce
INTERRUPT_ANY_PLAYER=0

[Mobs]
; Opcional: filtrar por ID (0 = qualquer) e/ou nome parcial
MOB_NPC_ID=0
MOB_NAME=

; Distancia pra aproximar do mob
MOB_APPROACH_DIST=150

; So re-move se ficar mais longe que APPROACH + slack
MOB_REPOSITION_SLACK=40

; 1 = ignora NPCs de servico tipicos (se voce listar em IGNORE_NPC_IDS)
IGNORE_NPC_IDS=

[Skills]
; Teclas extras no combate (player/mob). Vazio = so Attack forçado.
;SKILL_1_KEY=F1
;SKILL_1_INTERVAL_MS=800
;SKILL_2_KEY=F2
;SKILL_2_INTERVAL_MS=1200
;SKILL_3_KEY=F3
;SKILL_3_INTERVAL_MS=1600

[Safety]
; Sem mob / sem progresso por X segundos -> loga (nao aborta sozinho; espera janela)
IDLE_WARN_SEC=90

; Mesmo alvo X seg sem HP cair -> cancela e troca (0 = desliga)
; Apos ToV o script limpa alvo antigo — nao precisa esperar isso pra retomar.
STUCK_TARGET_SEC=3
; Quanto tempo ignora o OID antigo apos trocar
STUCK_IGNORE_SEC=8

[Loop]
; Menor = reage mais rapido a player te atacando / revive
SCAN_INTERVAL_MS=80
WAIT_LOG_INTERVAL_MS=15000
MOVE_INTERVAL_MS=1200
TARGET_RESCAN_MS=100
