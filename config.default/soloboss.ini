; =============================================================================
; L2Apollo — Solo Boss
; =============================================================================
; Fluxo:
;   1) Horario -> Buffer (se ligado) -> teleporta (ITEM Book ou NPC/GK)
;   2) Vai ate a coordenada 1
;   3) ESPERA o boss spawnar (ate BOSS_SPAWN_WAIT_SEC)
;   4) Mata (F1>F2>F3) + pickup
;   5) Loot no ponto -> coordenada 2 -> ... ate a ultima
;   6) Conclui o slot (Farm/PvPFarm voltam)
;
; Servidores diferentes: mude COORDS (3, 5, 7...) e BOSS_NAME / BOSS_NPC_ID.
; =============================================================================

[Geral]
ENABLED=1

[Schedule]
; Horarios do Solo Boss (HH:MM)
TIMES=11:50,13:10,15:15,18:15,20:50

REGISTER_OFFSET_SEC=0
REGISTER_WINDOW_SEC=300
ONCE_PER_SLOT=1
ALLOW_LATE_JOIN=1
LATE_JOIN_GRACE_SEC=60

[Teleport]
; ITEM = Book Teleport + menu | NPC = Gatekeeper no chao | BYPASS | NONE
TELEPORT_MODE=ITEM

TELEPORT_BYPASS=

TELEPORT_ITEM_ID=5588
TELEPORT_ITEM_NAME=Book Teleport
TELEPORT_ITEM_OPEN_DELAY_MS=1500

; Impact Global Gatekeeper -> [Solo Bosses]
TELEPORT_MENU_BUTTONS=Solo Bosses
TELEPORT_MENU_BUTTON_INDEX=1
TELEPORT_MENU_BUTTON_DELAY_MS=1200

; Se TELEPORT_MODE=NPC (GK no mapa)
GATE_NPC_ID=0
GATE_NPC_X=0
GATE_NPC_Y=0
GATE_NPC_Z=0
GATE_APPROACH_DIST=80
GATE_MAX_SEARCH_DIST=3000
GATE_DIALOG_OPEN_DELAY_MS=1500
GATE_MOVE_DELAY_MS=2000

; Apos o TP, confirma chegada no ponto de ENTRADA (spawn do Solo Boss)
ARRIVAL_TIMEOUT_MS=90000
MAX_TELEPORT_ATTEMPTS=3

[Entry]
; Ponto onde o TP te joga (spawn inicial do Solo Boss) — confirma "entrou".
; Impact: x:51154 y:82457 z:-3280
ENTRY_X=51154
ENTRY_Y=82457
ENTRY_Z=-3280
ENTRY_RADIUS=2500

[Giran]
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470
GIRAN_RADIUS=10000

[Waypoints]
; Ordem das coordenadas dos bosses (pipe). Ate 16 pontos.
; Impact (5 stages) — ajuste por servidor:
COORDS=53692,83600,-3544 | 54978,84448,-3568 | 55839,85294,-3568 | 56675,83636,-3560 | 55973,88148,-3568

; Distancia pra considerar "chegou" no waypoint
ARRIVE_RADIUS=200

[Boss]
; Nome parcial (substring). Impact: todos os stages batem com [STAGE
; (WP1=[STAGE 2], outros variam). NAO use so "[STAGE 3]" — trava nos outros.
BOSS_NAME=[STAGE
BOSS_NPC_ID=0
BOSS_FALLBACK=1

; Range em torno do WAYPOINT atual (nao pega boss do proximo WP)
BOSS_SEARCH_RANGE=1200
BOSS_APPROACH_DIST=80
BOSS_REPOSITION_SLACK=25

; Na coordenada: espera o spawn ate este tempo (opcao C — 5 min)
BOSS_SPAWN_WAIT_SEC=300

[Skills]
SKILL_1_KEY=F1
SKILL_1_INTERVAL_MS=800
SKILL_2_KEY=F2
SKILL_2_INTERVAL_MS=1200
SKILL_3_KEY=F3
SKILL_3_INTERVAL_MS=1600

[Loot]
LOOT_WAIT_SEC=15
PICKUP=1
PICKUP_RANGE=300
PICKUP_BURST=12
PICKUP_GAP_MS=25

[Loop]
SCAN_INTERVAL_MS=150
WAIT_LOG_INTERVAL_MS=10000
MOVE_INTERVAL_MS=1200

; Desvio (igual Buffer): parado em player/parede perto do WP/bau
ENABLE_UNSTUCK=1
UNSTUCK_OFFSET=300
UNSTUCK_OFFSET_STEP=120
UNSTUCK_SETTLE_MS=350
POSITION_STUCK_MS=1500
MAX_UNSTUCK_TRIES=8
MIN_MOVE=30

; Apos ultimo bau: espera sair de combate, depois volta pra Giran (RETURN do buffer.ini)
EXIT_WAIT_COMBAT_SEC=12
MAX_EXIT_ATTEMPTS=8
