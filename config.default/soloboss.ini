; =============================================================================
; L2Apollo — Solo Boss (template unico COMBAT + CHEST)
; =============================================================================
; MODE=COMBAT:
;   Horario -> TP -> anda nos COORDS -> mata boss -> loot -> proximo WP
;
; MODE=CHEST:
;   ConfirmDlg OK -> TP automatico do server -> anda nos COORDS
;   -> fala com "Solo Boss Chest" -> JA segue pro proximo WP.
;   A recompensa chega ~60s depois pelo servidor; nao espera no spot.
; =============================================================================

[Geral]
ENABLED=1
; Modos disponiveis:
;   COMBAT = fluxo anterior de matar boss e coletar loot
;   CHEST  = fluxo de popup + baus (Latin)
MODE=CHEST

[Schedule]
; COMBAT usa TIMES. CHEST + CONFIRM_LISTEN=1 pode deixar vazio.
TIMES=17:55, 09:55,

REGISTER_OFFSET_SEC=0
REGISTER_WINDOW_SEC=300
ONCE_PER_SLOT=0
ALLOW_LATE_JOIN=1
LATE_JOIN_GRACE_SEC=60

CONFIRM_LISTEN=1
; Trecho documental (API ConfirmDlg NAO expoe texto — use MsgID/Sender).
CONFIRM_TEXT=Solo Boss
; Latin Solo Boss invite (visto no log: MsgID=1987). Obrigatorio pra nao
; aceitar party/Barakiel/outro popup.
CONFIRM_MSG_ID=1987
CONFIRM_SENDER=
; 0 = so aceita se MsgID/SENDER bater. 1 = aceita QUALQUER ConfirmDlg (perigoso).
CONFIRM_ALLOW_ANY=0
CONFIRM_TIMEOUT_SEC=0

[Teleport]
; Modos: NONE | ITEM | NPC | BYPASS
; CHEST Latin usa NONE porque o servidor teleporta apos OK.
; As propriedades ITEM/NPC ficam mantidas para reutilizar em outro servidor.
TELEPORT_MODE=NONE

TELEPORT_BYPASS=
TELEPORT_ITEM_ID=5588
TELEPORT_ITEM_NAME=Book Teleport
TELEPORT_ITEM_OPEN_DELAY_MS=1500
TELEPORT_MENU_BUTTONS=Solo Bosses
TELEPORT_MENU_BUTTON_INDEX=1
TELEPORT_MENU_BUTTON_DELAY_MS=1200

GATE_NPC_ID=0
GATE_NPC_X=0
GATE_NPC_Y=0
GATE_NPC_Z=0
GATE_APPROACH_DIST=80
GATE_MAX_SEARCH_DIST=3000
GATE_DIALOG_OPEN_DELAY_MS=1500
GATE_MOVE_DELAY_MS=2000

ARRIVAL_TIMEOUT_MS=90000
MAX_TELEPORT_ATTEMPTS=3

[Entry]
; Spawn / centro da arena (confirma que saiu de Giran)
ENTRY_X=28026
ENTRY_Y=6145
ENTRY_Z=-3675
ENTRY_RADIUS=3500

[Giran]
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470
GIRAN_RADIUS=10000

[Waypoints]
; COMBAT: bosses | CHEST: locais onde nasce o bau.
; Latin Solo Boss — 6 pontos (ordem do percurso)
COORDS=29170,6623,-3680 | 32387,8878,-3659 | 33132,11452,-3622 | 32451,14452,-3532 | 30415,16609,-3704 | 27284,15905,-3648

ARRIVE_RADIUS=200

[Boss]
; Usado em MODE=COMBAT; mantido para trocar de modo sem remontar o INI.
BOSS_NAME=[STAGE
BOSS_NPC_ID=0
BOSS_FALLBACK=1
BOSS_SEARCH_RANGE=1200
BOSS_APPROACH_DIST=80
BOSS_REPOSITION_SLACK=25
BOSS_SPAWN_WAIT_SEC=300

[Chest]
; Usado em MODE=CHEST; ignorado em COMBAT.
CHEST_NPC_NAME=Solo Boss Chest
CHEST_NPC_ID=0
CHEST_SEARCH_RANGE=1200
CHEST_APPROACH_DIST=80
; Fala com o bau em qualquer ponto dentro deste raio (nao exige WP exato)
CHEST_TALK_RANGE=250
CHEST_SPAWN_WAIT_SEC=300
CHEST_SKIP_ON_TIMEOUT=1

[Skills]
; Usado em MODE=COMBAT.
SKILL_1_KEY=F1
SKILL_1_INTERVAL_MS=800
SKILL_2_KEY=F2
SKILL_2_INTERVAL_MS=1200
SKILL_3_KEY=F3
SKILL_3_INTERVAL_MS=1600

[Loot]
; Usado em MODE=COMBAT.
LOOT_WAIT_SEC=15
PICKUP=1
PICKUP_RANGE=300
PICKUP_BURST=12
PICKUP_GAP_MS=25

[Loop]
SCAN_INTERVAL_MS=150
WAIT_LOG_INTERVAL_MS=10000
MOVE_INTERVAL_MS=1200

; Desvio (igual Buffer): parado em player/parede perto do WP/bau
ENABLE_UNSTUCK=1
UNSTUCK_OFFSET=300
UNSTUCK_OFFSET_STEP=120
UNSTUCK_SETTLE_MS=350
POSITION_STUCK_MS=1500
MAX_UNSTUCK_TRIES=8
MIN_MOVE=30

; Apos ultimo bau: espera sair de combate, depois volta pra Giran (RETURN do buffer.ini)
EXIT_WAIT_COMBAT_SEC=45
MAX_EXIT_ATTEMPTS=6
