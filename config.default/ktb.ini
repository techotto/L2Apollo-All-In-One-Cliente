; =============================================================================
; L2Apollo — KTB (Kill The Boss)
; =============================================================================
; Fluxo:
;   1) Horario -> manda JOIN_COMMAND (.ktbjoin)
;   2) Espera sair de Giran (mapa aleatorio)
;   3) Acha o BOSS (NpcList — unico NPC vivo / maior MaxHP)
;   4) Fica EMBAIXO dele (range ~80) pra pegar drop no chao
;   5) Ataca F1>F2>F3 + Pickup o TEMPO TODO (combate e pos-morte)
;   6) Boss morre -> fica no ponto do drop por LOOT_WAIT_SEC (pickup burst)
;   7) Evento acaba quando VOLTAR pra Giran
; =============================================================================

[Geral]
ENABLED=1

[Schedule]
; Horarios do anuncio / abertura
TIMES=11:15,15:40,22:00

; Segundos depois do horario pra mandar o .ktbjoin (0 = no horario exato)
REGISTER_OFFSET_SEC=0

; Janela em que ainda tenta dar join (segundos) — 180 = 3 min
REGISTER_WINDOW_SEC=180

; 1 = so tenta 1x por horario do dia | 0 = pode retentar o mesmo slot
ONCE_PER_SLOT=1

; 1 = pode dar .ktbjoin a qualquer momento da janela (recomendado)
; 0 = so nos primeiros LATE_JOIN_GRACE_SEC — Buffer/force costuma estourar isso
ALLOW_LATE_JOIN=1
LATE_JOIN_GRACE_SEC=45

[Join]
JOIN_COMMAND=.ktbjoin
JOIN_METHOD=SAY_AND_VOICED
JOIN_DELAY_MS=2000
MAX_JOIN_ATTEMPTS=5

[Giran]
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470
GIRAN_RADIUS=10000

[Boss]
; ID/nome do boss sao ALEATORIOS no Impact — deixe 0 / vazio.
; No mapa do KTB so existe ESSE mob no raio: o script pega o unico NPC vivo.
BOSS_NPC_ID=0
BOSS_NAME=

; 1 = se tiver mais de 1 NPC no raio, pega o de maior MaxHP
BOSS_FALLBACK_BIGGEST=1

; Range pra achar o boss (unico mob no mapa)
BOSS_SEARCH_RANGE=5000

; Distancia pra ficar "embaixo" do boss (drop cai no pe dele)
BOSS_APPROACH_DIST=80

; Tolerancia: so move de novo se ficar mais longe que APPROACH + este valor
BOSS_REPOSITION_SLACK=25

[Skills]
SKILL_1_KEY=F1
SKILL_1_INTERVAL_MS=800
SKILL_2_KEY=F2
SKILL_2_INTERVAL_MS=1200
SKILL_3_KEY=F3
SKILL_3_INTERVAL_MS=1600

[Loot]
; Segundos parado no ponto do boss apos ele morrer (pegar drop)
LOOT_WAIT_SEC=20

; 1 = pickup durante combate + pos-morte
PICKUP=1

; Raio do Engine.Pickup
PICKUP_RANGE=300

; Quantos Pickup por tick (quanto maior, mais agressivo)
PICKUP_BURST=12

; Gap entre cada Pickup do burst (ms) — baixo = mais rapido
PICKUP_GAP_MS=25

[Safety]
IDLE_ABORT_SEC=180

[Loop]
SCAN_INTERVAL_MS=100
WAIT_LOG_INTERVAL_MS=10000
MOVE_INTERVAL_MS=1200
