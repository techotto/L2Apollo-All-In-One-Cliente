; =============================================================================
; L2Apollo â€” KTB (Kill The Boss)
; =============================================================================
; Fluxo:
;   1) Horario -> manda JOIN_COMMAND (.register / .ktbjoin)
;   2) Espera o TP do mapa (imediato OU no spawn do boss — depende do server)
;   3) Se boss longe: FOLLOW_PLAYERS segue a galera andando ate achar
;   4) Acha o BOSS (NpcList — unico NPC vivo / maior MaxHP)
;   5) Fica EMBAIXO dele (range ~80) pra pegar drop no chao
;   6) Ataca F1>F2>F3 + Pickup o TEMPO TODO (combate e pos-morte)
;   7) Boss morre -> fica no ponto do drop por LOOT_WAIT_SEC (pickup burst)
;   8) Evento acaba quando VOLTAR pra Giran
;
; Servers:
;   A) .register -> TP na hora pro mapa
;   B) .register so marca inscricao; TP vem quando o boss nasce (fim da janela).
;      wait-map CONTINUA depois de REGISTER_WINDOW — nao aborta.
; =============================================================================

[Geral]
ENABLED=1

; 1 = logs KTB[dbg] detalhados (pos, distJoin, TeleportDist/Time, chars, npcs, fases)
; 0 = so logs normais (menos spam). Use pra diagnosticar o TP do .register neste server.
DEBUG_LOGS=1


[Flows]
; Cenarios HTML Flows deste evento (ver aba Flows / htmlflows.ini)
ENABLE_HTML_FLOWS=0
FLOW_REASSERT_SEC=60
ENABLE_FLOWS_AUTO_ATTACK=0
ENABLE_FLOWS_AUTO_TARGET=0

[Schedule]
; Horarios do anuncio / abertura
TIMES=10:01, 12:41,14:51, 21:01, 00:11

; Segundos depois do horario pra mandar o .ktbjoin (0 = no horario exato)
REGISTER_OFFSET_SEC=15

; Janela em que ainda tenta dar join (segundos) â€” 180 = 3 min
REGISTER_WINDOW_SEC=120

; 1 = so tenta 1x por horario do dia | 0 = pode retentar o mesmo slot
ONCE_PER_SLOT=1

; 1 = pode dar .ktbjoin a qualquer momento da janela (recomendado)
; 0 = so nos primeiros LATE_JOIN_GRACE_SEC â€” Buffer/force costuma estourar isso
ALLOW_LATE_JOIN=0
LATE_JOIN_GRACE_SEC=45

[Join]
JOIN_COMMAND=.register
JOIN_METHOD=SAY_AND_VOICED
JOIN_DELAY_MS=5000
; 1 = um .register e espera o TP (servers com TP no spawn / fim da inscricao)
MAX_JOIN_ATTEMPTS=1
MAP_TELEPORT_DIST=5000
; Segundos esperando o TP depois do .register (vale AINDA com a janela fechada).
; Servers tipo B (TP no spawn do boss): deixe folga alem do fim da inscricao.
; 360 = 6 minutos
WAIT_MAP_TIMEOUT_SEC=360
; Re-tenta .register so DENTRO da janela (fora = so espera TP).
REJOIN_INTERVAL_SEC=60

[Giran]
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470
GIRAN_RADIUS=10000

[Boss]
; ID/nome do boss sao ALEATORIOS no Impact â€” deixe 0 / vazio no NAME.
; O subtitulo costuma ser fixo (ex.: "Event KTB" acima de "Angel Cherub").
BOSS_NPC_ID=0
BOSS_NAME=

; Subtitulo / Title do NPC (parcial). Ex.: Event KTB
; Com isso o script NAO pega Gatekeeper no mesmo mapa.
BOSS_TITLE=Event

; 1 = se tiver mais de 1 NPC no raio (sem title), pega o de maior MaxHP
BOSS_FALLBACK_BIGGEST=1

; Range pra achar o boss (unico mob no mapa)
BOSS_SEARCH_RANGE=5000

; Distancia pra ficar "embaixo" do boss (drop cai no pe dele)
BOSS_APPROACH_DIST=80

; Tolerancia: so move de novo se ficar mais longe que APPROACH + este valor
BOSS_REPOSITION_SLACK=25

[Follow]
; 1 = se o boss nao esta no range, segue players andando (galera vai pro ponto)
FOLLOW_PLAYERS=1

; 1 = se ninguem anda, vai no player mais longe do spawn (ja no boss parado)
FOLLOW_STANDING_FALLBACK=1

; Quanta distancia entre samples conta como "andando"
FOLLOW_MIN_MOVE=60

; Ate onde procura players na CharList
FOLLOW_RANGE=5000

; Chega nesta distancia do guia (nao cola nele)
FOLLOW_APPROACH_DIST=80

; Se o guia parar de andar por N ms, escolhe outro
FOLLOW_RESELECT_MS=3000

; Intervalo pra medir se o player se moveu
FOLLOW_SAMPLE_MS=500

[Skills]
SKILL_1_KEY=F1
SKILL_1_INTERVAL_MS=800
SKILL_2_KEY=F2
SKILL_2_INTERVAL_MS=1200
SKILL_3_KEY=F3
SKILL_3_INTERVAL_MS=1600

[Loot]
; Segundos parado no ponto do boss apos ele morrer (pegar drop)
LOOT_WAIT_SEC=1

; 1 = pickup durante combate + pos-morte
PICKUP=1

; Raio do Engine.Pickup
PICKUP_RANGE=10

; Quantos Pickup por tick (quanto maior, mais agressivo)
PICKUP_BURST=12

; Gap entre cada Pickup do burst (ms) â€” baixo = mais rapido
PICKUP_GAP_MS=25

[Safety]
IDLE_ABORT_SEC=320

[Loop]
SCAN_INTERVAL_MS=100
WAIT_LOG_INTERVAL_MS=10000
MOVE_INTERVAL_MS=1200
[AutoFarm]
; Tapumes: 0 = comportamento atual do script | 1 = deixa so o AutoFarm do SV
; Bloqueia Engine.Attack / Face / skills de combate do script
AF_BLOCK_ATTACK=0
; Bloqueia SetTarget / SetTargetID / Action(Ctrl) do script
AF_BLOCK_TARGET=0

