; =============================================================================
; L2Apollo — Horarios (CAPTURA de anuncios do chat)
; =============================================================================
; SO OBSERVA. Nao altera TIMES / agenda / join de TVT, Tournament, KTB, etc.
; Use a aba Horarios no painel pra ver o log e dar double-check.
; Depois de um dia capturando, voce atualiza a agenda na mao com seguranca.
; =============================================================================

[Geral]
; 1 = captura ligada | 0 = desliga (fila OnPacket fica off)
ENABLED=0

; Palavras-chave (virgula). Case-insensitive. Ex.: tvt, tournament, ktb
KEYWORDS=tvt, tournament, torneio, ktb, solo boss, boss, pvp, team




; Se a mensagem tiver QUALQUER destas, ignora (ex.: fim do evento, nao inicio)
; Ex.: "Tournament: 15 minute(s) till event finish!" -> tem finish -> descarta
EXCLUDE_KEYWORDS=finish, finished, ending, ends in, acabou, terminou




; 1 = so aceita se o texto tiver ALGUMA das TIME_WORDS abaixo
REQUIRE_TIME_WORD=1

; Palavras de tempo (virgula). Case-insensitive. Substring no anuncio.
; Ex.: minut cobre minute/minutes; min; time; minuto(s)
TIME_WORDS=alou, minut, minutes, minute, minuto, minutos, min, time, minute(s)


; 1 = so aceita se tiver "Announcement(s)/anuncio" (filtra trade chat)
REQUIRE_ANNOUNCE=0

; Faixa de minutos aceita no anuncio
MIN_MINUTES=1
MAX_MINUTES=60

; Quantas capturas guardar no log (arquivo horarios_log.dat)
; 0 = ilimitado (append no arquivo; painel le o arquivo)
; >0 = teto (descarta as mais antigas no arquivo)
MAX_LOG=0
