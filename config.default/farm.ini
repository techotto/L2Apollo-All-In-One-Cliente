; =============================================================================
; L2Apollo — Farm (spot idle / prioridade MAIS BAIXA)
; =============================================================================
; Roda SO quando NAO ha evento ativo (Tour / TVT / KTB / PvP Farm).
; Vai pro local de farm e deixa o Adrenaline atacar (Face Control + skills).
;
; COMBAT_PRIORITY (ou COMBAT_MODE):
;   MOB     = so monstros (Flow AA/AT / Face)
;   RETAIL  = farma mob; hit/agro -> revida player SEM Ctrl
;   PLAYERS = caca players SEM Ctrl (sem PK)
;
; Ao ceder pro evento: solta combate NA HORA (TVT/.join funciona em combate).
; Limpar AGRO (todos os mobs te atacando) + sair de combate so ocorre
; quando for TELEPORTAR de verdade (ApolloLeaveCombatForTeleport).
;
; Prioridade:
;   Tour / TVT / KTB  >  PvP Farm  >  Farm (este)
; =============================================================================

[Geral]
ENABLED=1


[Flows]
; Cenarios HTML Flows deste evento (ver aba Flows / htmlflows.ini)
ENABLE_HTML_FLOWS=1
FLOW_REASSERT_SEC=15
ENABLE_FLOWS_AUTO_ATTACK=1
ENABLE_FLOWS_AUTO_TARGET=1

[Teleport]
; ENTRADA no spot: NONE | BYPASS | ITEM | NPC
TELEPORT_MODE=ITEM
TELEPORT_MENU_BUTTONS=Farm Zone, 1| Random Spot, 1

TELEPORT_ITEM_ID=5588
TELEPORT_ITEM_NAME=Tutorial Guide
TELEPORT_BYPASS=

GATE_NPC_ID=10003
GATE_NPC_X=83481
GATE_NPC_Y=147901
GATE_NPC_Z=-3384

; --- Avancado (accordion "Mais opcoes do teleporte") ---
TELEPORT_ITEM_OPEN_DELAY_MS=1500
TELEPORT_MENU_BUTTON_INDEX=1
TELEPORT_MENU_BUTTON_DELAY_MS=1200
GATE_APPROACH_DIST=80
GATE_MAX_SEARCH_DIST=3000
GATE_DIALOG_OPEN_DELAY_MS=1500
GATE_MOVE_DELAY_MS=2000
GATE_ENABLE_UNSTUCK=0
GATE_UNSTUCK_OFFSET=280
GATE_UNSTUCK_OFFSET_STEP=100
GATE_POSITION_STUCK_MS=1200
GATE_MAX_UNSTUCK_TRIES=10
GATE_MIN_MOVE=30
GATE_WALK_PULSE_MS=800
GATE_CROWD_SCAN=250
ARRIVAL_TIMEOUT_MS=60000
MAX_TELEPORT_ATTEMPTS=3

[Return]
; SAIDA do spot pra Giran. NONE = reusa RETURN_* do buffer.ini
RETURN_MODE=ITEM
RETURN_MENU_BUTTONS=Giran Town, 1

RETURN_BYPASS=
RETURN_ITEM_ID=5588
RETURN_ITEM_NAME=Tutorial Guide

RETURN_GATE_NPC_ID=0
RETURN_GATE_NPC_X=0
RETURN_GATE_NPC_Y=0
RETURN_GATE_NPC_Z=0

; --- Avancado (accordion "Mais opcoes do retorno") ---
RETURN_ITEM_OPEN_DELAY_MS=1500
RETURN_MENU_BUTTON_INDEX=1
RETURN_MENU_BUTTON_DELAY_MS=1200
RETURN_ARRIVAL_TIMEOUT_MS=15000
RETURN_GATE_APPROACH_DIST=80
RETURN_GATE_MAX_SEARCH_DIST=3000
RETURN_GATE_DIALOG_OPEN_DELAY_MS=1500
RETURN_GATE_MOVE_DELAY_MS=2000

[Giran]
; ---------------------------------------------------------------------------
; NAO edite aqui â€” coords oficiais em buffer.ini [Giran].
; ---------------------------------------------------------------------------
GIRAN_X=82872
GIRAN_Y=148648
GIRAN_Z=-3464
GIRAN_RADIUS=10000

[Zone]
; Spot do Farm idle (OBRIGATORIO com PvP Farm ligado).
; PvP Farm LE este ZONE â€” nao preencha ZONE no pvpfarm.ini.
ZONE_X=137080
ZONE_Y=-75960
ZONE_Z=-4008
ZONE_RADIUS=30000

[Combat]
; MOB | RETAIL | PLAYERS  (aliases: RETALIATE/PROTEGER, HUNT/CACAR/PVP)
COMBAT_PRIORITY=MOB
PLAYER_SEARCH_RANGE=2500

; SCRIPT_ASSIST=0 (recomendado no MOB) — so Adrenaline Face Control
; RETAIL/PLAYERS ignoram e usam assist do script
SCRIPT_ASSIST=1

; --- Avancado (accordion "Mais opcoes do combate") ---
; So usados se SCRIPT_ASSIST=1
ASSIST_RANGE=8000
CHASE_DIST=450
; 1 = no spot liga Face/Ataque JUNTO com AutoFarm do SV
USE_FACECONTROL_WITH_AUTOFARM=1

[Safety]
; --- Avancado (accordion "Mais opcoes de seguranca") ---
STUCK_TARGET_SEC=12
STUCK_IGNORE_SEC=2

[Loop]
; --- Avancado (accordion "Mais opcoes do loop") ---
SCAN_INTERVAL_MS=50
WAIT_LOG_INTERVAL_MS=30000
[AutoFarm]
AF_BLOCK_ATTACK=0
AF_BLOCK_TARGET=0

