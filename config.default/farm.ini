; =============================================================================
; L2Apollo — Farm (spot idle / prioridade MAIS BAIXA)
; =============================================================================
; Roda SO quando NAO ha evento ativo (Tour / TVT / KTB / PvP Farm).
; Vai pro local de farm e deixa o Adrenaline atacar (Face Control + skills).
;
; Ao ceder pro evento: solta combate NA HORA (TVT/.join funciona em combate).
; Limpar AGRO (todos os mobs te atacando) + sair de combate so ocorre
; quando for TELEPORTAR de verdade (ApolloLeaveCombatForTeleport).
;
; Prioridade:
;   Tour / TVT / KTB  >  PvP Farm  >  Farm (este)
; =============================================================================

[Geral]
ENABLED=1

[Teleport]
; ENTRADA no spot: NONE | BYPASS | ITEM | NPC
; Independente da saida ([Return] abaixo).
; Ex.: entra pelo GK (NPC) e sai pelo item que abre HTM.
TELEPORT_MODE=ITEM

TELEPORT_BYPASS=

TELEPORT_ITEM_ID=5588
TELEPORT_ITEM_NAME=Tutorial Guide
TELEPORT_ITEM_OPEN_DELAY_MS=1500

; AJUSTE o botao do menu pro seu spot de farm (ex.: Aden, Orc Barracks...)
TELEPORT_MENU_BUTTONS=Farm Areas, 1| Top Spot 1, 1
TELEPORT_MENU_BUTTON_INDEX=1
TELEPORT_MENU_BUTTON_DELAY_MS=1200

; Se TELEPORT_MODE=NPC (entrada pelo Gatekeeper)
GATE_NPC_ID=0
GATE_NPC_X=0
GATE_NPC_Y=0
GATE_NPC_Z=0
GATE_APPROACH_DIST=80
GATE_MAX_SEARCH_DIST=3000
GATE_DIALOG_OPEN_DELAY_MS=1500
GATE_MOVE_DELAY_MS=2000

; Desvio inteligente ate o GK (Giran lotado de players)
GATE_ENABLE_UNSTUCK=0
GATE_UNSTUCK_OFFSET=280
GATE_UNSTUCK_OFFSET_STEP=100
GATE_POSITION_STUCK_MS=1200
GATE_MAX_UNSTUCK_TRIES=10
GATE_MIN_MOVE=30
GATE_WALK_PULSE_MS=800
; Raio pra medir crowd e escolher o lado livre do NPC
GATE_CROWD_SCAN=250

[Return]
; SAIDA do spot pra Giran (rebuff, sem mob, saiu da zona).
; ITEM = usa o item e clica o HTM na ordem (ex. Towns and Villages -> Giran)
; NPC  = fala com GK no spot
; BYPASS = comando direto
; NONE = reusa RETURN_* do buffer.ini
RETURN_MODE=ITEM
RETURN_BYPASS=
RETURN_ITEM_ID=5588
RETURN_ITEM_NAME=Tutorial Guide
RETURN_ITEM_OPEN_DELAY_MS=1500
; Um passo por tela do HTM, separados por |
; Ex. do Gatekeeper usavel: Towns and Villages,1 | Giran,1
RETURN_MENU_BUTTONS=Towns & Cities, 1| Teleport to Town, 1
RETURN_MENU_BUTTON_INDEX=1
RETURN_MENU_BUTTON_DELAY_MS=1200
RETURN_ARRIVAL_TIMEOUT_MS=15000

; Se RETURN_MODE=NPC (GK no spot de farm)
RETURN_GATE_NPC_ID=0
RETURN_GATE_NPC_X=0
RETURN_GATE_NPC_Y=0
RETURN_GATE_NPC_Z=0
RETURN_GATE_APPROACH_DIST=80
RETURN_GATE_MAX_SEARCH_DIST=3000
RETURN_GATE_DIALOG_OPEN_DELAY_MS=1500
RETURN_GATE_MOVE_DELAY_MS=2000

[Giran]
GIRAN_X=82872
GIRAN_Y=148568
GIRAN_Z=-3464
GIRAN_RADIUS=10000

; ---------------------------------------------------------------------------
; Spot do Farm idle (OBRIGATORIO com PvP Farm ligado).
; PvP Farm LE este ZONE — nao preencha ZONE no pvpfarm.ini (area random).
; ---------------------------------------------------------------------------
ZONE_X=146664
ZONE_Y=-175640
ZONE_Z=-1520
ZONE_RADIUS=30000

ARRIVAL_TIMEOUT_MS=60000
MAX_TELEPORT_ATTEMPTS=3

[Combat]
; Farm so leva ao spot e LIGA o Face Control.
; Ataque / Busca de alvo / range = configure no Adrenaline (abas Ataque e
; Busca de alvo). O script NAO escolhe target por padrao.
;
; SCRIPT_ASSIST=0  (recomendado) — so Adrenaline
; SCRIPT_ASSIST=1  — script tambem SetTarget/MoveTo (pode brigar com Face)
SCRIPT_ASSIST=0

; So usados se SCRIPT_ASSIST=1
ASSIST_RANGE=8000
CHASE_DIST=450

[AutoFarm]
; =============================================================================
; AUTOFARM DO SERVIDOR (HTML)
; =============================================================================
; Cada servidor tem comando e HTML diferentes. Este bloco mapeia:
;   1) Como ABRIR a janela (.autofarm / bypass / .menu + caminho)
;   2) Como DETECTAR se esta LIGADO ou DESLIGADO no HTML
;   3) Como LIGAR/DESLIGAR (bypass 00 / clicar Set / Auto Attack...)
;
; Liga ao CHEGAR no spot. Desliga ao sair / morrer / ceder evento.
; =============================================================================

; 0 = desligado | 1 = usa AutoFarm do servidor no spot
ENABLE_SERVER_AUTOFARM=1

; ---------------------------------------------------------------------------
; 1) ABRIR A JANELA
; CHAT   = manda no chat (ex.: .autofarm) + voiced_*
; BYPASS = BypassToServer direto (ex.: voiced_farm)
; MENU   = abre OPEN_COMMAND (ex.: .menu) e clica OPEN_MENU_BUTTONS
; NONE   = nao abre (so se voce ja deixa aberto)
; ---------------------------------------------------------------------------
; Neste SV o bypass real e voiced_farm (botao "Auto Farm" no .menu).
OPEN_MODE=BYPASS
OPEN_COMMAND=voiced_farm

; So se OPEN_MODE=MENU — mesmo formato do teleporte:
;   TextoDoBotao, ocorrencia | ProximoBotao, 1
; Ex.: Auto Farm,1
OPEN_MENU_BUTTONS=Auto Farm,1
OPEN_DELAY_MS=1500
OPEN_MENU_DELAY_MS=1200

; ---------------------------------------------------------------------------
; 2) DETECTAR A JANELA E O ESTADO ON/OFF
; Use termos da PAGINA do AutoFarm (Auto Attack/Set), NAO so "auto farm"
; (isso existe no .menu e engana o detector).
; ---------------------------------------------------------------------------
WINDOW_NEEDLES=auto attack|auto target|shortcut page|target range|target type

; BUTTON = o botao mostra o PROXIMO estado (ex.: value="OFF" = ja ligado)
; STATUS = o HTML mostra o estado ATUAL (label OFF/ON ao lado de Auto Attack)
; Seu SV (Auto Attack OFF [Set]): use STATUS
DETECT_MODE=STATUS

; Substring no HTML = "ja esta LIGADO" (STATUS: texto ON)
TEXT_ACTIVE=ON

; Substring = "esta DESLIGADO" (STATUS: se achar OFF, ainda nao esta ligado)
TEXT_INACTIVE=OFF

; ---------------------------------------------------------------------------
; 3) LIGAR / DESLIGAR
; BYPASS = manda TOGGLE_BYPASS direto (ex.: 00)
; CLICK  = clica labels do HTML (Set...) — formato Label,N | Label,N
; Seu SV: clique nos dois Set (Auto Attack + Auto Target)
; ---------------------------------------------------------------------------
TOGGLE_MODE=CLICK
TOGGLE_BYPASS=00

; Auto Attack = Set #1 | Auto Target = Set #2
TOGGLE_CLICK_ON=Set,2| 
TOGGLE_CLICK_OFF=Set,2 |

; ---------------------------------------------------------------------------
; 3b) SETUP DA JANELA (depois de ligar Auto Attack/Target)
; Cliques extras: Long, Monsters, Apply, Page 1...
; Formato: Label,N | Label,N   (mesmo do teleporte)
; Ex.: Long,1 | Monsters,1
; ---------------------------------------------------------------------------
SETUP_CLICKS=Long,1| Monsters,1

ACTION_DELAY_MS=800
; 1 = fecha a janela HTML depois de ligar/desligar/setup
CLOSE_AFTER=1

; 1 = Adrenaline FaceControl / Ataque automatico JUNTO com AutoFarm do SV
;     (recomendado: no spot os dois ficam ligados)
; 0 = so o AutoFarm do servidor (sem Face do Adrenaline)
USE_FACECONTROL_WITH_AUTOFARM=1

; ---------------------------------------------------------------------------
; 4) RETENTATIVA E DIAGNOSTICO
; ---------------------------------------------------------------------------
; Enquanto o AutoFarm nao estiver ON no spot, tenta de novo a cada X ms.
; Cobre: script iniciado ja no spot, falha na 1a tentativa, revive.
; 0 = so tenta ao chegar no spot
RECHECK_MS=20000

; 1 = despeja o HTML cru da janela no log do cliente.
; Use pra descobrir WINDOW_NEEDLES / TEXT_ACTIVE / labels do SETUP e depois
; volte pra 0.
DEBUG_DUMP_HTML=0

[Safety]
; Mesmo alvo X seg sem HP cair -> cancela e troca (0 = desliga)
STUCK_TARGET_SEC=12
; Segundos ignorando o OID apos troca por stuck (nao precisa ser alto)
STUCK_IGNORE_SEC=2

[Loop]
; Ritmo do stuck/log. Assist de alvo roda TODO tick (sem esperar isso).
SCAN_INTERVAL_MS=50
WAIT_LOG_INTERVAL_MS=30000
