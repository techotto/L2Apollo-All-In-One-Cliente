; =============================================================================
; L2Apollo — Farm (spot idle / prioridade MAIS BAIXA)
; =============================================================================
; Roda SO quando NAO ha evento ativo (Tour / TVT / KTB / PvP Farm).
; Vai pro local de farm e deixa o Adrenaline atacar (Face Control + skills).
;
; Ao ceder pro evento: solta combate NA HORA (TVT/.join funciona em combate).
; Limpar AGRO (todos os mobs te atacando) + sair de combate so ocorre
; quando for TELEPORTAR de verdade (ApolloLeaveCombatForTeleport).
;
; Prioridade:
;   Tour / TVT / KTB  >  PvP Farm  >  Farm (este)
; =============================================================================

[Geral]
ENABLED=1

[Teleport]
; Como IR pro spot: NONE | BYPASS | ITEM | NPC
TELEPORT_MODE=NPC

TELEPORT_BYPASS=

TELEPORT_ITEM_ID=12610
TELEPORT_ITEM_NAME=Book Teleport
TELEPORT_ITEM_OPEN_DELAY_MS=1500

; AJUSTE o botao do menu pro seu spot de farm (ex.: Aden, Orc Barracks...)
TELEPORT_MENU_BUTTONS=TP 6, 1|
TELEPORT_MENU_BUTTON_INDEX=1
TELEPORT_MENU_BUTTON_DELAY_MS=1200

; Se TELEPORT_MODE=NPC
GATE_NPC_ID=9902
GATE_NPC_X=83412
GATE_NPC_Y=147986
GATE_NPC_Z=-3400
GATE_APPROACH_DIST=80
GATE_MAX_SEARCH_DIST=3000
GATE_DIALOG_OPEN_DELAY_MS=1500
GATE_MOVE_DELAY_MS=2000

; Desvio inteligente ate o GK (Giran lotado de players)
GATE_ENABLE_UNSTUCK=1
GATE_UNSTUCK_OFFSET=280
GATE_UNSTUCK_OFFSET_STEP=100
GATE_POSITION_STUCK_MS=1200
GATE_MAX_UNSTUCK_TRIES=10
GATE_MIN_MOVE=30
GATE_WALK_PULSE_MS=800
; Raio pra medir crowd e escolher o lado livre do NPC
GATE_CROWD_SCAN=250

[Giran]
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470
GIRAN_RADIUS=10000

; ---------------------------------------------------------------------------
; Spot do Farm idle (OBRIGATORIO com PvP Farm ligado).
; PvP Farm LE este ZONE — nao preencha ZONE no pvpfarm.ini (area random).
; ---------------------------------------------------------------------------
ZONE_X=-11722
ZONE_Y=-46614
ZONE_Z=-10811
ZONE_RADIUS=15000

ARRIVAL_TIMEOUT_MS=60000
MAX_TELEPORT_ATTEMPTS=3

[Combat]
; Sempre Adrenaline — Face Control + lista de skills/CHAR/MOB do bot.
; (Nao usa F1/F2/F3 do script.)

[Safety]
; Mesmo alvo X seg sem HP cair -> cancela e troca (0 = desliga)
STUCK_TARGET_SEC=12
STUCK_IGNORE_SEC=8

; Sem causar dano no alvo por X seg -> volta pra Giran e re-teleporta
; (mesmo TELEPORT_* do ini). 0 = desliga. Default 240 = 4 min.
NO_HIT_EXIT_SEC=120

[Loop]
SCAN_INTERVAL_MS=200
WAIT_LOG_INTERVAL_MS=30000
