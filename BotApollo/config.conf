# Porta da Machine (Apollo). AUTO = detecta sozinho (recomendado).
# Ex.: COM3 so se quiser forcar.

ARDUINO_PORT=AUTO

ARDUINO_BAUD=115200

ARDUINO_SCAN_MAX=40

ARDUINO_RESCAN_S=8



# ---------------------------------------------------------------------------

# MODO SIMPLES (padrao - compativel com quem ja usa hoje)

# Procura IMAGE_FILE na tela e clica nela mesma.

# So e usado se NAO existir rules.conf (ou se rules.conf estiver vazio).

# PNGs ficam na pasta images\

# ---------------------------------------------------------------------------

IMAGE_FILE=images/imagem.png



# ---------------------------------------------------------------------------

# MODO REGRAS (opcional - super atualizacao)

# Crie rules.conf a partir de rules.conf.example:

#   images/condicao.png -> images/alvo.png

#   images/popup.png -> images/botao_ok.png

#   images/advertencia.png -> @self

# Se rules.conf existir com regras, IMAGE_FILE e ignorado.

# ---------------------------------------------------------------------------

# RULES_FILE=rules.conf



# Confianca minima da comparacao: normalmente entre 0.70 e 0.90.

MATCH_THRESHOLD=0.80



# Numero do monitor (1 = principal).

MONITOR=1



# Intervalo entre capturas e tempo minimo entre cliques.

CHECK_INTERVAL_S=0.10

CLICK_COOLDOWN_S=1.0



# Spam F12 (f12_spam.py): intervalo entre teclas em segundos.

# 0.08 ~= 12 teclas/s | 0.05 ~= 20/s | 0.15 ~= 6/s | 0 = maximo

F12_INTERVAL_S=0.05



# ---------------------------------------------------------------------------

# INTERFACE (janela pequena sempre no topo: ATIVO / PAUSADO)

# ---------------------------------------------------------------------------

UI_ENABLED=1

# Atalho global liga/desliga (ex.: F8, PAUSE, CTRL+SHIFT+F9)
UI_HOTKEY=F8



# Quando o All-In-One pedir Fixed, traz a janela do jogo pra frente.

FOCUS_GAME_ON_FIXED=1

GAME_WINDOW_TITLE=Lineage

GAME_WINDOW_MAXIMIZE=0

