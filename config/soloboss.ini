; =============================================================================
; L2Apollo — Solo Boss
; =============================================================================
; MODE=COMBAT (default / Impact):
;   1) Horario -> Buffer -> teleporta (ITEM Book ou NPC/GK)
;   2) Vai ate a coordenada 1
;   3) ESPERA o boss spawnar (ate BOSS_SPAWN_WAIT_SEC)
;   4) Mata (F1>F2>F3) + pickup
;   5) Loot no ponto -> coordenada 2 -> ... ate a ultima
;
; MODE=CHEST (Latin Solo Boss Box):
;   1) Escuta ConfirmDlg ("Do you want to join Solo Boss...") -> OK
;   2) Servidor teleporta sozinho (TELEPORT_MODE=NONE)
;   3) Anda pelos COORDS (quantos quiser, pipe-separados)
;   4) Acha "Solo Boss Chest", abre dialogo e JA vai pro proximo WP
;      (recompensa cai ~60s depois no server — nao precisa ficar no spot)
; =============================================================================

[Geral]
ENABLED=1
; Modos disponiveis:
;   COMBAT = fluxo anterior: horario/TP, mata boss, loot e proximo ponto
;   CHEST  = aceita popup, servidor teleporta, fala com bau e proximo ponto
MODE=COMBAT

[Schedule]
; Horarios do Solo Boss (HH:MM). Em MODE=CHEST + CONFIRM_LISTEN=1 pode ficar vazio.
TIMES=11:50,13:10,15:15,18:15,20:50

REGISTER_OFFSET_SEC=0
REGISTER_WINDOW_SEC=300
ONCE_PER_SLOT=1
ALLOW_LATE_JOIN=1
LATE_JOIN_GRACE_SEC=60

; --- so MODE=CHEST ---
; 1 = escuta popup ConfirmDlg sem depender de TIMES
CONFIRM_LISTEN=0
; Nome apenas para log (a API do Adrenaline nao expoe o texto do popup)
CONFIRM_TEXT=Solo Boss
; Filtros reais do ConfirmDlg. 0/vazio = aceita qualquer popup valido.
; Para filtrar, descubra MsgID/Sender no servidor e preencha.
CONFIRM_MSG_ID=0
CONFIRM_SENDER=
; 0 = escuta pra sempre enquanto o modulo estiver idle
CONFIRM_TIMEOUT_SEC=0

[Teleport]
; ITEM = Book Teleport + menu | NPC = Gatekeeper no chao | BYPASS | NONE
; Em MODE=CHEST o server ja TP apos OK → use NONE
TELEPORT_MODE=ITEM

TELEPORT_BYPASS=

TELEPORT_ITEM_ID=5588
TELEPORT_ITEM_NAME=Book Teleport
TELEPORT_ITEM_OPEN_DELAY_MS=1500

; Impact Global Gatekeeper -> [Solo Bosses]
TELEPORT_MENU_BUTTONS=Solo Bosses
TELEPORT_MENU_BUTTON_INDEX=1
TELEPORT_MENU_BUTTON_DELAY_MS=1200

; Se TELEPORT_MODE=NPC (GK no mapa)
GATE_NPC_ID=0
GATE_NPC_X=0
GATE_NPC_Y=0
GATE_NPC_Z=0
GATE_APPROACH_DIST=80
GATE_MAX_SEARCH_DIST=3000
GATE_DIALOG_OPEN_DELAY_MS=1500
GATE_MOVE_DELAY_MS=2000

; Apos o TP / Confirm, timeout aguardando chegada na ENTRY
ARRIVAL_TIMEOUT_MS=90000
MAX_TELEPORT_ATTEMPTS=3

[Entry]
; Ponto onde o TP te joga (spawn inicial) — confirma "entrou".
; Impact: x:51154 y:82457 z:-3280
ENTRY_X=51154
ENTRY_Y=82457
ENTRY_Z=-3280
ENTRY_RADIUS=2500

[Giran]
GIRAN_X=82698
GIRAN_Y=148638
GIRAN_Z=-3470
GIRAN_RADIUS=10000

[Waypoints]
; Ordem das coordenadas (pipe). Lista flexivel; limite de seguranca: 64 pontos.
; Impact (5 stages):
COORDS=53692,83600,-3544 | 54978,84448,-3568 | 55839,85294,-3568 | 56675,83636,-3560 | 55973,88148,-3568

; Distancia pra considerar "chegou" no waypoint
ARRIVE_RADIUS=200

[Boss]
; --- so MODE=COMBAT ---
; Nome parcial (substring). Impact: todos os stages batem com [STAGE
BOSS_NAME=[STAGE
BOSS_NPC_ID=0
BOSS_FALLBACK=1

BOSS_SEARCH_RANGE=1200
BOSS_APPROACH_DIST=80
BOSS_REPOSITION_SLACK=25
BOSS_SPAWN_WAIT_SEC=300

[Chest]
; --- so MODE=CHEST ---
CHEST_NPC_NAME=Solo Boss Chest
CHEST_NPC_ID=0
CHEST_SEARCH_RANGE=1200
CHEST_APPROACH_DIST=80
; Tempo max esperando o bau spawnar em cada WP
CHEST_SPAWN_WAIT_SEC=300
; 1 = se timeout no bau, pula pro proximo WP | 0 = aborta a rota
CHEST_SKIP_ON_TIMEOUT=1

[Skills]
; --- so MODE=COMBAT ---
SKILL_1_KEY=F1
SKILL_1_INTERVAL_MS=800
SKILL_2_KEY=F2
SKILL_2_INTERVAL_MS=1200
SKILL_3_KEY=F3
SKILL_3_INTERVAL_MS=1600

[Loot]
; --- so MODE=COMBAT ---
LOOT_WAIT_SEC=15
PICKUP=1
PICKUP_RANGE=300
PICKUP_BURST=12
PICKUP_GAP_MS=25

[Loop]
SCAN_INTERVAL_MS=150
WAIT_LOG_INTERVAL_MS=10000
MOVE_INTERVAL_MS=1200
